name: Preview nightly candidate artifact export
run-name: chummer-preview-nightly-export-${{ inputs.runner_nonce }}

# Security boundary: register only a single-job JIT runner with the constructed
# chummer-preview-nightly-export-<nonce> label. Run it as a non-root user in a
# fresh disposable container with only /candidate-input mounted read-only. Do
# not mount a host home, Docker socket, credentials, sibling repositories, or
# the rest of the candidate. Destroy the runner and container after this job.

on:
  workflow_dispatch:
    inputs:
      runner_nonce:
        description: Unique 12..64 character lowercase nonce of the disposable JIT runner
        required: true
        type: string
      candidate_version:
        description: Exact preview candidate version recorded by the canonical manifest
        required: true
        type: string
      candidate_manifest_sha256:
        description: Exact lowercase SHA-256 of RELEASE_CHANNEL.generated.json
        required: true
        type: string
      expected_source_sha:
        description: Exact lowercase main commit SHA explicitly authorized for this export
        required: true
        type: string
      export_confirmed:
        description: I mounted only the exact candidate subset read-only in the disposable runner
        required: true
        type: boolean

permissions: {}

jobs:
  preflight:
    name: Validate authority before JIT allocation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      runner_label: ${{ steps.validate.outputs.runner_label }}
      runner_nonce: ${{ steps.validate.outputs.runner_nonce }}
      candidate_version: ${{ steps.validate.outputs.candidate_version }}
      candidate_manifest_sha256: ${{ steps.validate.outputs.candidate_manifest_sha256 }}
      expected_source_sha: ${{ steps.validate.outputs.expected_source_sha }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      source_ref: ${{ steps.validate.outputs.source_ref }}
    steps:
      - name: Validate dispatch and repository authority
        id: validate
        shell: bash
        env:
          EXPORT_CONFIRMED: ${{ inputs.export_confirmed }}
          RUNNER_NONCE: ${{ inputs.runner_nonce }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          exact = {
              "EXPORT_CONFIRMED": re.compile(r"true"),
              "RUNNER_NONCE": re.compile(r"[a-z0-9]{12,64}"),
              "CANDIDATE_VERSION": re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}"),
              "CANDIDATE_MANIFEST_SHA256": re.compile(r"[0-9a-f]{64}"),
              "EXPECTED_SOURCE_SHA": re.compile(r"[0-9a-f]{40}"),
              "SOURCE_SHA": re.compile(r"[0-9a-f]{40}"),
              "SOURCE_REF": re.compile(r"refs/heads/main"),
              "DEFAULT_BRANCH": re.compile(r"main"),
          }
          for name, pattern in exact.items():
              value = os.environ.get(name, "")
              if pattern.fullmatch(value) is None:
                  raise SystemExit(f"preflight rejected non-canonical {name}")
          if os.environ["SOURCE_SHA"] != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("preflight rejected stale or mismatched source authority")
          outputs = {
              "runner_label": "chummer-preview-nightly-export-" + os.environ["RUNNER_NONCE"],
              "runner_nonce": os.environ["RUNNER_NONCE"],
              "candidate_version": os.environ["CANDIDATE_VERSION"],
              "candidate_manifest_sha256": os.environ["CANDIDATE_MANIFEST_SHA256"],
              "expected_source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in outputs.items():
                  output.write(f"{key}={value}\n")
          PY

  export:
    name: Export exact candidate bytes
    needs: preflight
    environment: preview-nightly-candidate-export
    permissions:
      contents: read
    concurrency:
      group: preview-nightly-candidate-export-${{ needs.preflight.outputs.runner_nonce }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ needs.preflight.outputs.runner_label }}
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload-candidate.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload-candidate.outputs.artifact-url }}
      content_inventory_sha256: ${{ steps.materialize.outputs.content_inventory_sha256 }}
      candidate_handoff_json: ${{ steps.producer-handoff.outputs.candidate_handoff_json }}
    env:
      CANDIDATE_INPUT_ROOT: /candidate-input
      CANDIDATE_OUTPUT_ROOT: ${{ runner.temp }}/preview-nightly-candidate-export
      OUTPUT_ARTIFACT_NAME: preview-nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      DISPOSABLE_RUNNER_NONCE: ${{ needs.preflight.outputs.runner_nonce }}
      CANDIDATE_VERSION: ${{ needs.preflight.outputs.candidate_version }}
      CANDIDATE_MANIFEST_SHA256: ${{ needs.preflight.outputs.candidate_manifest_sha256 }}
      EXPECTED_SOURCE_SHA: ${{ needs.preflight.outputs.expected_source_sha }}
      VALIDATED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      VALIDATED_SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
    steps:
      - name: Check out the pinned exporter contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify the pinned runner Python runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 --version)" = "Python 3.12.3"

      - name: Validate and materialize the exact five-file subset
        id: materialize
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/preview_nightly_candidate_export.py \
            --input-root "$CANDIDATE_INPUT_ROOT" \
            --output-root "$CANDIDATE_OUTPUT_ROOT" \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-workflow .github/workflows/preview-nightly-candidate-export.yml \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-ref "$VALIDATED_SOURCE_REF" \
            --source-sha "$VALIDATED_SOURCE_SHA" \
            --expected-source-sha "$EXPECTED_SOURCE_SHA" \
            --source-actor "$GITHUB_ACTOR" \
            --artifact-name "$OUTPUT_ARTIFACT_NAME" \
            --runner-nonce "$DISPOSABLE_RUNNER_NONCE" \
            --require-read-only-input >> "$GITHUB_OUTPUT"

      - name: Upload the immutable candidate artifact only
        id: upload-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ env.CANDIDATE_OUTPUT_ROOT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record the exact producer handoff
        id: producer-handoff
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-candidate.outputs.artifact-url }}
          CONTENT_INVENTORY_SHA256: ${{ steps.materialize.outputs.content_inventory_sha256 }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re

          artifact_id = os.environ["ARTIFACT_ID"]
          artifact_digest_value = os.environ["ARTIFACT_DIGEST"]
          inventory_digest = os.environ["CONTENT_INVENTORY_SHA256"]
          if not re.fullmatch(r"[1-9][0-9]*", artifact_id):
              raise SystemExit("candidate artifact ID is missing or invalid")
          if re.fullmatch(r"[0-9a-f]{64}", artifact_digest_value) is None:
              raise SystemExit("candidate artifact digest is missing or invalid")
          artifact_digest = artifact_digest_value
          if not re.fullmatch(r"[0-9a-f]{64}", inventory_digest):
              raise SystemExit("candidate content inventory digest is missing or invalid")
          handoff = {
              "actor": os.environ["GITHUB_ACTOR"],
              "artifactId": artifact_id,
              "artifactName": os.environ["OUTPUT_ARTIFACT_NAME"],
              "artifactSha256": artifact_digest,
              "contentInventorySha256": inventory_digest,
              "contractName": "chummer6-ui.preview-nightly-candidate-handoff",
              "contractVersion": 1,
              "ref": os.environ["GITHUB_REF"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha": os.environ["GITHUB_SHA"],
              "workflow": ".github/workflows/preview-nightly-candidate-export.yml",
          }
          canonical = json.dumps(handoff, sort_keys=True, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate_handoff_json={canonical}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Preview nightly candidate artifact\n\n")
              summary.write(f"Artifact: `{os.environ['OUTPUT_ARTIFACT_NAME']}`\n\n")
              summary.write(f"Artifact URL: {os.environ['ARTIFACT_URL']}\n\n")
              summary.write("Capture handoff JSON:\n\n```json\n")
              summary.write(canonical)
              summary.write("\n```\n")
          PY

  relay-capture:
    name: Relay immutable handoff to native capture
    needs: export
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch only the fixed native capture workflow
        shell: bash
        env:
          CANDIDATE_HANDOFF_JSON: ${{ needs.export.outputs.candidate_handoff_json }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.error
          import urllib.request

          raw = os.environ["CANDIDATE_HANDOFF_JSON"]
          try:
              handoff = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"relay rejected invalid handoff JSON: {exc}")
          keys = {
              "actor", "artifactId", "artifactName", "artifactSha256",
              "contentInventorySha256", "contractName", "contractVersion", "ref",
              "repository", "runAttempt", "runId", "sha", "workflow",
          }
          if not isinstance(handoff, dict) or set(handoff) != keys:
              raise SystemExit("relay rejected a handoff with missing or extra fields")
          canonical = json.dumps(handoff, sort_keys=True, separators=(",", ":"))
          if raw != canonical:
              raise SystemExit("relay rejected non-canonical handoff JSON")
          expected = {
              "contractName": "chummer6-ui.preview-nightly-candidate-handoff",
              "contractVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": ".github/workflows/preview-nightly-candidate-export.yml",
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "ref": os.environ["GITHUB_REF"],
              "sha": os.environ["GITHUB_SHA"],
              "actor": os.environ["GITHUB_ACTOR"],
          }
          for key, value in expected.items():
              if handoff.get(key) != value or type(handoff.get(key)) is not type(value):
                  raise SystemExit(f"relay rejected handoff {key} authority")
          for key in ("runId", "runAttempt", "artifactId"):
              if re.fullmatch(r"[1-9][0-9]*", handoff[key]) is None:
                  raise SystemExit(f"relay rejected handoff {key}")
          expected_name = f"preview-nightly-candidate-{handoff['runId']}-{handoff['runAttempt']}"
          if handoff["artifactName"] != expected_name:
              raise SystemExit("relay rejected handoff artifactName")
          for key in ("artifactSha256", "contentInventorySha256"):
              if re.fullmatch(r"[0-9a-f]{64}", handoff[key]) is None:
                  raise SystemExit(f"relay rejected handoff {key}")
          request = urllib.request.Request(
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + "/actions/workflows/windows-native-evidence-capture.yml/dispatches",
              data=json.dumps(
                  {"ref": "main", "inputs": {"candidate_handoff_json": canonical}},
                  separators=(",", ":"),
              ).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2026-03-10",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise SystemExit(f"capture dispatch returned HTTP {response.status}")
                  response_body = response.read(16_385)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"capture dispatch failed with HTTP {exc.code}") from exc
          if len(response_body) > 16_384:
              raise SystemExit("capture dispatch response exceeded the fixed bound")

          def exact_pairs(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit("capture dispatch response contains duplicate keys")
                  result[key] = value
              return result

          def reject_nonfinite(_value):
              raise SystemExit("capture dispatch response contains a non-finite number")

          try:
              dispatch = json.loads(
                  response_body.decode("utf-8"),
                  object_pairs_hook=exact_pairs,
                  parse_constant=reject_nonfinite,
              )
          except (UnicodeDecodeError, json.JSONDecodeError) as exc:
              raise SystemExit("capture dispatch returned invalid UTF-8 JSON") from exc
          response_keys = {"workflow_run_id", "run_url", "html_url"}
          if not isinstance(dispatch, dict) or set(dispatch) != response_keys:
              raise SystemExit("capture dispatch returned an inexact run identity")
          workflow_run_id = dispatch["workflow_run_id"]
          if type(workflow_run_id) is not int or workflow_run_id < 1:
              raise SystemExit("capture dispatch returned an invalid workflow run ID")
          expected_api_url = (
              "https://api.github.com/repos/"
              + os.environ["GITHUB_REPOSITORY"]
              + f"/actions/runs/{workflow_run_id}"
          )
          expected_html_url = (
              "https://github.com/"
              + os.environ["GITHUB_REPOSITORY"]
              + f"/actions/runs/{workflow_run_id}"
          )
          if (
              dispatch["run_url"] != expected_api_url
              or dispatch["html_url"] != expected_html_url
          ):
              raise SystemExit("capture dispatch returned repository-mismatched run URLs")
          PY
