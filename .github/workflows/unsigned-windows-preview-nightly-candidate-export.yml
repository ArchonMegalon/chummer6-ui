name: Unsigned Windows preview nightly candidate export
run-name: chummer-unsigned-windows-preview-export-${{ inputs.runner_nonce }}

# The host launcher registers one disposable JIT runner with the exact nonce
# label and mounts only /candidate-input read-only. This workflow exports an
# ephemeral GitHub artifact. A separate least-privilege hosted relay validates
# that artifact through the Actions API and dispatches only the protected
# evidence-capture workflow; neither job signs, publishes, or deploys.

on:
  workflow_dispatch:
    inputs:
      runner_nonce:
        description: Unique lowercase nonce of the disposable JIT runner
        required: true
        type: string
      candidate_version:
        description: Exact preview version in the canonical manifest
        required: true
        type: string
      candidate_manifest_sha256:
        description: Exact SHA-256 of RELEASE_CHANNEL.generated.json
        required: true
        type: string
      expected_source_sha:
        description: Exact main commit authorized for this export
        required: true
        type: string
      export_confirmed:
        description: Candidate input is the governed read-only subset
        required: true
        type: boolean

permissions: {}

jobs:
  preflight:
    name: Validate unsigned export authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      runner_label: ${{ steps.validate.outputs.runner_label }}
      runner_nonce: ${{ steps.validate.outputs.runner_nonce }}
      candidate_version: ${{ steps.validate.outputs.candidate_version }}
      candidate_manifest_sha256: ${{ steps.validate.outputs.candidate_manifest_sha256 }}
      source_sha: ${{ steps.validate.outputs.source_sha }}
      source_ref: ${{ steps.validate.outputs.source_ref }}
    steps:
      - name: Validate dispatch and protected-main identity
        id: validate
        shell: bash
        env:
          EXPORT_CONFIRMED: ${{ inputs.export_confirmed }}
          RUNNER_NONCE: ${{ inputs.runner_nonce }}
          CANDIDATE_VERSION: ${{ inputs.candidate_version }}
          CANDIDATE_MANIFEST_SHA256: ${{ inputs.candidate_manifest_sha256 }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          exact = {
              "EXPORT_CONFIRMED": r"true",
              "RUNNER_NONCE": r"[a-z0-9]{12,64}",
              "CANDIDATE_VERSION": r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}",
              "CANDIDATE_MANIFEST_SHA256": r"[0-9a-f]{64}",
              "EXPECTED_SOURCE_SHA": r"[0-9a-f]{40}",
              "SOURCE_SHA": r"[0-9a-f]{40}",
              "SOURCE_REF": r"refs/heads/main",
              "SOURCE_REPOSITORY": re.escape("ArchonMegalon/chummer6-ui"),
              "DEFAULT_BRANCH": r"main",
          }
          for name, pattern in exact.items():
              if re.fullmatch(pattern, os.environ.get(name, "")) is None:
                  raise SystemExit(f"preflight rejected non-canonical {name}")
          if os.environ["SOURCE_SHA"] != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("preflight rejected stale source authority")
          values = {
              "runner_label": (
                  "chummer-unsigned-windows-preview-export-"
                  + os.environ["RUNNER_NONCE"]
              ),
              "runner_nonce": os.environ["RUNNER_NONCE"],
              "candidate_version": os.environ["CANDIDATE_VERSION"],
              "candidate_manifest_sha256": os.environ[
                  "CANDIDATE_MANIFEST_SHA256"
              ],
              "source_sha": os.environ["SOURCE_SHA"],
              "source_ref": os.environ["SOURCE_REF"],
          }
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  output.write(f"{key}={value}\n")
          PY

  export:
    name: Export exact unsigned Windows candidate bytes
    needs: preflight
    permissions:
      contents: read
    concurrency:
      group: unsigned-windows-preview-${{ needs.preflight.outputs.runner_nonce }}
      cancel-in-progress: false
    runs-on:
      - self-hosted
      - linux
      - x64
      - ${{ needs.preflight.outputs.runner_label }}
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload-candidate.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
      artifact_name: ${{ steps.relay-bindings.outputs.artifact_name }}
      candidate_inventory_sha256: ${{ steps.relay-bindings.outputs.candidate_inventory_sha256 }}
    env:
      CANDIDATE_INPUT_ROOT: /candidate-input
      OUTPUT_ARTIFACT_NAME: unsigned-windows-preview-nightly-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      DISPOSABLE_RUNNER_NONCE: ${{ needs.preflight.outputs.runner_nonce }}
      CANDIDATE_VERSION: ${{ needs.preflight.outputs.candidate_version }}
      CANDIDATE_MANIFEST_SHA256: ${{ needs.preflight.outputs.candidate_manifest_sha256 }}
      VALIDATED_SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      VALIDATED_SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
    steps:
      - name: Check out the exact exporter contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify pinned Python runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(python3 --version)" = "Python 3.12.3"

      - name: Validate and materialize unsigned Windows subset
        shell: bash
        env:
          CANDIDATE_OUTPUT_ROOT: ${{ runner.temp }}/unsigned-windows-preview-export
        run: |
          set -euo pipefail
          test ! -e "$CANDIDATE_OUTPUT_ROOT"
          python3 scripts/preview_nightly_unsigned_candidate_export.py \
            --candidate-root "$CANDIDATE_INPUT_ROOT" \
            --output-root "$CANDIDATE_OUTPUT_ROOT" \
            --expected-version "$CANDIDATE_VERSION" \
            --expected-manifest-sha256 "$CANDIDATE_MANIFEST_SHA256" \
            --source-sha "$VALIDATED_SOURCE_SHA" \
            --source-repository ArchonMegalon/chummer6-ui \
            --source-workflow .github/workflows/unsigned-windows-preview-nightly-candidate-export.yml \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --source-ref "$VALIDATED_SOURCE_REF" \
            --source-actor "$GITHUB_ACTOR" \
            --runner-nonce "$DISPOSABLE_RUNNER_NONCE"

      - name: Seal exact relay bindings
        id: relay-bindings
        shell: bash
        env:
          CANDIDATE_OUTPUT_ROOT: ${{ runner.temp }}/unsigned-windows-preview-export
        run: |
          set -euo pipefail
          inventory="$CANDIDATE_OUTPUT_ROOT/PREVIEW_NIGHTLY_UNSIGNED_CANDIDATE_CONTENT_INVENTORY.generated.json"
          test -f "$inventory"
          inventory_sha256="$(sha256sum "$inventory" | cut -d' ' -f1)"
          [[ "$inventory_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$OUTPUT_ARTIFACT_NAME" =~ ^unsigned-windows-preview-nightly-candidate-[1-9][0-9]*-[1-9][0-9]*$ ]]
          {
            echo "artifact_name=$OUTPUT_ARTIFACT_NAME"
            echo "candidate_inventory_sha256=$inventory_sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Upload ephemeral candidate transport artifact
        id: upload-candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/unsigned-windows-preview-export
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record non-authoritative transport summary
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-candidate.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-candidate.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-candidate.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          if re.fullmatch(r"[1-9][0-9]*", os.environ.get("ARTIFACT_ID", "")) is None:
              raise SystemExit("artifact ID is invalid")
          digest = os.environ.get("ARTIFACT_DIGEST", "")
          if digest.startswith("sha256:"):
              digest = digest[7:]
          if re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("artifact digest is invalid")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Unsigned Windows preview candidate\n\n")
              summary.write(f"Artifact ID: `{os.environ['ARTIFACT_ID']}`\n\n")
              summary.write(f"Transport SHA-256: `{digest}`\n\n")
              summary.write(f"Artifact URL: {os.environ['ARTIFACT_URL']}\n\n")
              summary.write("Publication/upload/deployment authority: `false`\n")
          PY

  relay-capture:
    name: Relay exact candidate to protected native capture
    needs:
      - preflight
      - export
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact relay contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate producer artifact and dispatch evidence capture only
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          ARTIFACT_ID: ${{ needs.export.outputs.artifact_id }}
          ARTIFACT_DIGEST: ${{ needs.export.outputs.artifact_digest }}
          ARTIFACT_NAME: ${{ needs.export.outputs.artifact_name }}
          CANDIDATE_INVENTORY_SHA256: ${{ needs.export.outputs.candidate_inventory_sha256 }}
          CANDIDATE_MANIFEST_SHA256: ${{ needs.preflight.outputs.candidate_manifest_sha256 }}
          CANDIDATE_VERSION: ${{ needs.preflight.outputs.candidate_version }}
          SOURCE_REF: ${{ needs.preflight.outputs.source_ref }}
          SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { workflowRunPathMatches } = require(
              './scripts/github_workflow_run_path.js'
            );
            const producerWorkflow = (
              '.github/workflows/'
              + 'unsigned-windows-preview-nightly-candidate-export.yml'
            );
            const captureWorkflow = (
              '.github/workflows/'
              + 'unsigned-windows-preview-native-evidence-capture.yml'
            );
            const exact = (value, pattern, label) => {
              if (typeof value !== 'string' || !pattern.test(value)) {
                throw new Error(`${label} is not canonical`);
              }
              return value;
            };
            const positive = value => exact(
              value, /^[1-9][0-9]*$/, 'positive integer'
            );
            const safeApiInteger = (value, label) => {
              const exactValue = positive(value);
              const number = Number(exactValue);
              if (!Number.isSafeInteger(number)
                  || String(number) !== exactValue) {
                throw new Error(`${label} exceeds exact API integer authority`);
              }
              return number;
            };
            const normalizeDigest = value => (
              String(value || '').replace(/^sha256:/, '')
            );
            const commit = /^[0-9a-f]{40}$/;
            const sha256 = /^[0-9a-f]{64}$/;
            const login = (
              /^(?:[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?|github-actions\[bot\])$/
            );
            const version = /^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$/;
            const artifactId = exact(
              process.env.ARTIFACT_ID, /^[1-9][0-9]*$/, 'artifact ID'
            );
            const artifactName = exact(
              process.env.ARTIFACT_NAME,
              /^unsigned-windows-preview-nightly-candidate-[1-9][0-9]*-[1-9][0-9]*$/,
              'artifact name'
            );
            const artifactDigest = exact(
              normalizeDigest(process.env.ARTIFACT_DIGEST),
              sha256,
              'artifact digest'
            );
            const inventorySha256 = exact(
              process.env.CANDIDATE_INVENTORY_SHA256,
              sha256,
              'candidate inventory SHA-256'
            );
            const manifestSha256 = exact(
              process.env.CANDIDATE_MANIFEST_SHA256,
              sha256,
              'candidate manifest SHA-256'
            );
            const candidateVersion = exact(
              process.env.CANDIDATE_VERSION,
              version,
              'candidate version'
            );
            const sourceSha = exact(
              process.env.SOURCE_SHA, commit, 'candidate source SHA'
            );
            if (context.repo.owner !== 'ArchonMegalon'
                || context.repo.repo !== 'chummer6-ui'
                || process.env.SOURCE_REF !== 'refs/heads/main'
                || process.env.GITHUB_REF !== 'refs/heads/main'
                || process.env.GITHUB_SHA !== sourceSha) {
              throw new Error('relay producer source is not exact protected main');
            }
            const runId = safeApiInteger(
              process.env.GITHUB_RUN_ID, 'producer run ID'
            );
            const runAttempt = positive(process.env.GITHUB_RUN_ATTEMPT);
            const expectedName = (
              `unsigned-windows-preview-nightly-candidate-`
              + `${runId}-${runAttempt}`
            );
            if (artifactName !== expectedName) {
              throw new Error('relay artifact name is not run-bound');
            }
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
            if (run.data.status !== 'in_progress'
                || run.data.conclusion !== null
                || run.data.event !== 'workflow_dispatch'
                || String(run.data.run_attempt) !== runAttempt
                || run.data.head_branch !== 'main'
                || run.data.head_sha !== sourceSha
                || !run.data.actor
                || !login.test(run.data.actor.login || '')
                || run.data.actor.login !== process.env.GITHUB_ACTOR
                || !workflowRunPathMatches(
                  run.data.path,
                  producerWorkflow,
                  {
                    branch: 'main',
                    ref: 'refs/heads/main',
                    sha: sourceSha,
                  }
                )) {
              throw new Error('relay producer workflow identity differs');
            }
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              }
            );
            const matches = artifacts.filter(artifact =>
              String(artifact.id) === artifactId
              && artifact.name === artifactName
              && artifact.expired === false
            );
            if (matches.length !== 1) {
              throw new Error('relay requires one exact producer artifact');
            }
            const artifact = matches[0];
            if (normalizeDigest(artifact.digest) !== artifactDigest
                || !Number.isSafeInteger(artifact.size_in_bytes)
                || artifact.size_in_bytes < 1
                || artifact.size_in_bytes > 2 * 1024 * 1024 * 1024) {
              throw new Error('relay producer artifact metadata differs');
            }
            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            const contractSha = exact(
              main.data.object.sha, commit, 'capture contract SHA'
            );
            const contract = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: captureWorkflow,
              ref: contractSha,
            });
            if (Array.isArray(contract.data)
                || contract.data.type !== 'file'
                || contract.data.path !== captureWorkflow) {
              throw new Error('current main lacks the exact capture contract');
            }
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: (
                'unsigned-windows-preview-native-evidence-capture.yml'
              ),
              ref: 'main',
              inputs: {
                candidate_run_id: String(runId),
                candidate_run_attempt: runAttempt,
                candidate_sha: sourceSha,
                candidate_actor: run.data.actor.login,
                candidate_artifact_id: artifactId,
                candidate_artifact_name: artifactName,
                candidate_artifact_sha256: artifactDigest,
                candidate_version: candidateVersion,
                candidate_manifest_sha256: manifestSha256,
                candidate_inventory_sha256: inventorySha256,
                expected_contract_sha: contractSha,
                capture_confirmed: true,
              },
            });
            core.summary
              .addHeading('Unsigned preview native evidence relay')
              .addRaw(`Producer SHA: \`${sourceSha}\`\n\n`)
              .addRaw(`Capture contract SHA: \`${contractSha}\`\n\n`)
              .addRaw('Downstream actor: `github-actions[bot]`\n\n')
              .addRaw('Publication/upload/deployment authority: `false`\n')
              .write();
