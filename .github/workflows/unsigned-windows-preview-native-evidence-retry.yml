name: Retry exact unsigned Windows preview native evidence
run-name: retry-unsigned-windows-preview-native-30233434560

on:
  workflow_dispatch:
    inputs:
      retry_confirmed:
        description: Retry the exact failed evidence capture; grant no publication authority
        required: true
        type: boolean

permissions: {}

concurrency:
  group: retry-unsigned-windows-preview-native-30233434560
  cancel-in-progress: false

jobs:
  relay:
    name: Authenticate failed evidence capture and relay exact candidate
    if: >-
      inputs.retry_confirmed == true &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.repository == 'ArchonMegalon/chummer6-ui' &&
      github.actor == 'ArchonMegalon' &&
      github.triggering_actor == github.actor &&
      github.actor_id == '11421547'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out exact main retry contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate and relay one evidence-only retry
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          RETRY_CONFIRMED: ${{ inputs.retry_confirmed }}
          EXPECTED_CANDIDATE_RUN_ID: "30233434560"
          EXPECTED_CANDIDATE_ARTIFACT_ID: "8640821385"
          EXPECTED_CANDIDATE_ARTIFACT_NAME: unsigned-windows-preview-nightly-candidate-30233434560-1
          EXPECTED_CANDIDATE_ARTIFACT_SHA256: 3f2054323ab553647a9cb4e86cbc40658e1c46d895767e49ee1caa6fbb674cac
          EXPECTED_CANDIDATE_ARTIFACT_SIZE: "54265931"
          EXPECTED_CANDIDATE_SHA: 8303b2058c7adbc87f7b1beaa53413a8ec9c2a3c
          EXPECTED_FAILED_CAPTURE_RUN_ID: "30241713809"
          EXPECTED_FAILED_CAPTURE_SHA: fc023cf555b2dc9c8622df57c488e8407fddecdb
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_ID: "8643552023"
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_NAME: unsigned-windows-preview-native-diagnostics-30241713809-1
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_SHA256: 5c8241c978777d69300014e1c9975c4bad3480e094f5e84960a77e79614b56eb
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_SIZE: "2518"
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_CREATED_AT: "2026-07-27T06:11:06Z"
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_UPDATED_AT: "2026-07-27T06:11:06Z"
          EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_EXPIRES_AT: "2026-08-10T06:11:05Z"
          EXPECTED_REPOSITORY_ID: "1178943375"
          EXPECTED_OPERATOR_ID: "11421547"
        with:
          github-token: ${{ github.token }}
          script: |
            if (process.env.RETRY_CONFIRMED !== 'true') {
              throw new Error('retry_confirmed must be true');
            }
            if (process.env.GITHUB_EVENT_NAME !== 'workflow_dispatch'
                || process.env.GITHUB_REF !== 'refs/heads/main'
                || process.env.GITHUB_RUN_ATTEMPT !== '1'
                || process.env.GITHUB_REPOSITORY !== 'ArchonMegalon/chummer6-ui'
                || context.repo.owner !== 'ArchonMegalon'
                || context.repo.repo !== 'chummer6-ui'
                || process.env.GITHUB_ACTOR !== 'ArchonMegalon'
                || process.env.GITHUB_TRIGGERING_ACTOR !== process.env.GITHUB_ACTOR
                || process.env.GITHUB_ACTOR_ID !== process.env.EXPECTED_OPERATOR_ID) {
              throw new Error('retry relay requires the authenticated owner on protected main');
            }
            const { workflowRunPathMatches } = require('./scripts/github_workflow_run_path.js');
            const candidateWorkflow = '.github/workflows/unsigned-windows-preview-nightly-candidate-export.yml';
            const captureWorkflow = '.github/workflows/unsigned-windows-preview-native-evidence-capture.yml';
            const main = await github.rest.git.getRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: 'heads/main',
            });
            if (main.data.object.sha !== process.env.GITHUB_SHA) {
              throw new Error('retry relay SHA is not current main');
            }
            const captureContract = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: captureWorkflow,
              ref: process.env.GITHUB_SHA,
            });
            if (Array.isArray(captureContract.data)
                || captureContract.data.type !== 'file'
                || captureContract.data.path !== captureWorkflow
                || !Number.isSafeInteger(captureContract.data.size)
                || captureContract.data.size < 1
                || captureContract.data.size > 256 * 1024) {
              throw new Error('current-main capture contract identity differs');
            }

            const candidate = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.EXPECTED_CANDIDATE_RUN_ID),
            });
            if (candidate.data.status !== 'completed'
                || candidate.data.conclusion !== 'success'
                || candidate.data.event !== 'workflow_dispatch'
                || candidate.data.run_attempt !== 1
                || candidate.data.head_branch !== 'main'
                || candidate.data.head_sha !== process.env.EXPECTED_CANDIDATE_SHA
                || !candidate.data.actor
                || candidate.data.actor.login !== 'ArchonMegalon'
                || !candidate.data.triggering_actor
                || candidate.data.triggering_actor.login !== 'ArchonMegalon'
                || !workflowRunPathMatches(candidate.data.path, candidateWorkflow, {
                  branch: candidate.data.head_branch,
                  ref: 'refs/heads/main',
                  sha: candidate.data.head_sha,
                })) {
              throw new Error('exact candidate producer run metadata differs');
            }
            const candidateArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.EXPECTED_CANDIDATE_RUN_ID),
                per_page: 100,
              }
            );
            const exactArtifacts = candidateArtifacts.filter(artifact =>
              String(artifact.id) === process.env.EXPECTED_CANDIDATE_ARTIFACT_ID
              && artifact.name === process.env.EXPECTED_CANDIDATE_ARTIFACT_NAME
              && artifact.digest === `sha256:${process.env.EXPECTED_CANDIDATE_ARTIFACT_SHA256}`
              && String(artifact.size_in_bytes) === process.env.EXPECTED_CANDIDATE_ARTIFACT_SIZE
              && artifact.expired === false
            );
            if (exactArtifacts.length !== 1) {
              throw new Error('exact candidate artifact identity differs');
            }

            const failedCapture = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: Number(process.env.EXPECTED_FAILED_CAPTURE_RUN_ID),
            });
            const expectedCaptureTitle =
              `unsigned-windows-preview-native-${process.env.EXPECTED_CANDIDATE_RUN_ID}-1`;
            if (failedCapture.data.status !== 'completed'
                || failedCapture.data.conclusion !== 'failure'
                || failedCapture.data.event !== 'workflow_dispatch'
                || failedCapture.data.run_attempt !== 1
                || failedCapture.data.head_branch !== 'main'
                || failedCapture.data.head_sha !== process.env.EXPECTED_FAILED_CAPTURE_SHA
                || failedCapture.data.display_title !== expectedCaptureTitle
                || !failedCapture.data.actor
                || failedCapture.data.actor.login !== 'github-actions[bot]'
                || !failedCapture.data.triggering_actor
                || failedCapture.data.triggering_actor.login !== 'github-actions[bot]'
                || !workflowRunPathMatches(failedCapture.data.path, captureWorkflow, {
                  branch: failedCapture.data.head_branch,
                  ref: 'refs/heads/main',
                  sha: failedCapture.data.head_sha,
                })) {
              throw new Error('prior failed capture identity differs');
            }
            const failedJobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.EXPECTED_FAILED_CAPTURE_RUN_ID),
                filter: 'all',
                per_page: 100,
              }
            );
            if (failedJobs.length !== 1
                || failedJobs[0].name !== 'Capture exact unsigned preview on hosted native Windows'
                || failedJobs[0].conclusion !== 'failure') {
              throw new Error('prior failed capture job identity differs');
            }
            const infrastructureStepNames = new Set([
              'Set up job',
              'Check out the exact capture contract',
              'Post Check out the exact capture contract',
              'Complete job',
            ]);
            const contractSteps = (failedJobs[0].steps || []).filter(
              step => !infrastructureStepNames.has(step.name)
            );
            const expectedSteps = [
              ['Validate protected capture authority and exact producer artifact', 'success'],
              ['Download only the authenticated candidate artifact', 'success'],
              ['Revalidate exact unsigned candidate bytes', 'success'],
              ['Capture native startup and installer visuals', 'failure'],
              ['Seal non-authoritative capture evidence', 'skipped'],
              ['Upload evidence artifact only', 'skipped'],
              ['Record evidence-only artifact identity', 'skipped'],
              ['Upload failure-only sanitized startup diagnostics', 'success'],
              ['Remove downloaded candidate bytes', 'success'],
            ];
            if (contractSteps.length !== expectedSteps.length) {
              throw new Error('prior failed capture contract-step count differs');
            }
            for (let index = 0; index < expectedSteps.length; index += 1) {
              const [name, conclusion] = expectedSteps[index];
              if (contractSteps[index].name !== name
                  || contractSteps[index].conclusion !== conclusion) {
                throw new Error(`prior failed capture step differs: ${name}`);
              }
            }
            const failedArtifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: Number(process.env.EXPECTED_FAILED_CAPTURE_RUN_ID),
                per_page: 100,
              }
            );
            if (failedArtifacts.length !== 1) {
              throw new Error('prior failed capture artifact count differs');
            }
            const diagnostics = failedArtifacts[0];
            if (String(diagnostics.id) !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_ID
                || diagnostics.name !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_NAME
                || diagnostics.digest !== `sha256:${process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_SHA256}`
                || String(diagnostics.size_in_bytes) !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_SIZE
                || diagnostics.created_at !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_CREATED_AT
                || diagnostics.updated_at !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_UPDATED_AT
                || diagnostics.expires_at !== process.env.EXPECTED_FAILED_DIAGNOSTICS_ARTIFACT_EXPIRES_AT
                || diagnostics.expired !== false
                || !diagnostics.workflow_run
                || String(diagnostics.workflow_run.id) !== process.env.EXPECTED_FAILED_CAPTURE_RUN_ID
                || diagnostics.workflow_run.head_branch !== 'main'
                || diagnostics.workflow_run.head_sha !== process.env.EXPECTED_FAILED_CAPTURE_SHA
                || String(diagnostics.workflow_run.repository_id) !== process.env.EXPECTED_REPOSITORY_ID
                || String(diagnostics.workflow_run.head_repository_id) !== process.env.EXPECTED_REPOSITORY_ID) {
              throw new Error('prior failed diagnostics artifact identity differs');
            }

            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'unsigned-windows-preview-native-evidence-capture.yml',
              ref: 'main',
              inputs: {
                candidate_run_id: '30233434560',
                candidate_run_attempt: '1',
                candidate_sha: '8303b2058c7adbc87f7b1beaa53413a8ec9c2a3c',
                candidate_actor: 'ArchonMegalon',
                candidate_artifact_id: '8640821385',
                candidate_artifact_name: 'unsigned-windows-preview-nightly-candidate-30233434560-1',
                candidate_artifact_sha256: '3f2054323ab553647a9cb4e86cbc40658e1c46d895767e49ee1caa6fbb674cac',
                candidate_version: 'run-20260727-025130',
                candidate_manifest_sha256: '7328ad808df2f7f191e8cc65da672bc460eb4d1456c042fe3725ad588f26c9cf',
                candidate_inventory_sha256: 'b983cbbd3922a9680b11b78eeac7a4d4a5d5daaae5cd6816f991567dea4581cf',
                expected_contract_sha: process.env.GITHUB_SHA,
                capture_confirmed: true,
              },
            });

      - name: Record evidence-only relay boundary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Exact-candidate native evidence retry relayed'
            echo
            echo 'Candidate run: 30233434560 attempt 1'
            echo 'Candidate artifact ID: 8640821385'
            echo 'Prior failed capture run: 30241713809'
            echo
            echo 'Evidence capture only; finalization/publication/upload/deployment authority: false'
          } >> "$GITHUB_STEP_SUMMARY"
