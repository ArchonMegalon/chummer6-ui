name: Windows native evidence capture

on:
  workflow_dispatch:
    inputs:
      candidate_handoff_json:
        description: Exact canonical JSON emitted by the fixed preview candidate exporter
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-native-evidence-capture-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture on native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-capture.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-capture.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload-capture.outputs.artifact-url }}
      capture_inventory_sha256: ${{ steps.inventory.outputs.capture_inventory_sha256 }}
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      EVIDENCE_ROOT: ${{ github.workspace }}/native-evidence
      OUTPUT_ARTIFACT_NAME: windows-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out evidence contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Authenticate exact candidate run and artifact
        id: candidate-run
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { workflowRunPathMatches } = require('./scripts/github_workflow_run_path.js');
            const producerWorkflow = '.github/workflows/preview-nightly-candidate-export.yml';
            const producerRef = 'refs/heads/main';
            const handoffKeys = [
              'actor', 'artifactId', 'artifactName', 'artifactSha256',
              'contentInventorySha256', 'contractName', 'contractVersion', 'ref',
              'repository', 'runAttempt', 'runId', 'sha', 'workflow'
            ].sort();
            let handoff;
            try { handoff = JSON.parse(process.env.CANDIDATE_HANDOFF_JSON); }
            catch (error) { throw new Error('candidate_handoff_json is invalid JSON'); }
            if (!handoff || Array.isArray(handoff) || typeof handoff !== 'object') {
              throw new Error('candidate_handoff_json must be an object');
            }
            if (JSON.stringify(Object.keys(handoff).sort()) !== JSON.stringify(handoffKeys)) {
              throw new Error('candidate_handoff_json has missing or extra fields');
            }
            const canonical = JSON.stringify(Object.fromEntries(
              Object.keys(handoff).sort().map(key => [key, handoff[key]])
            ));
            if (canonical !== process.env.CANDIDATE_HANDOFF_JSON) {
              throw new Error('candidate_handoff_json must use exact canonical JSON serialization');
            }
            const exact = {
              contractName: 'chummer6-ui.preview-nightly-candidate-handoff',
              contractVersion: 1,
              repository: process.env.GITHUB_REPOSITORY,
              workflow: producerWorkflow,
              ref: producerRef,
              sha: process.env.GITHUB_SHA,
            };
            for (const [key, value] of Object.entries(exact)) {
              if (handoff[key] !== value || typeof handoff[key] !== typeof value) {
                throw new Error(`candidate handoff ${key} authority mismatch`);
              }
            }
            if (process.env.GITHUB_ACTOR !== 'github-actions[bot]') {
              throw new Error('native capture must be dispatched by the hosted producer relay');
            }
            for (const key of ['runId', 'runAttempt', 'artifactId']) {
              if (typeof handoff[key] !== 'string' || !/^[1-9][0-9]*$/.test(handoff[key])) {
                throw new Error(`candidate handoff ${key} must be an exact positive integer string`);
              }
              const numeric = Number(handoff[key]);
              if (!Number.isSafeInteger(numeric) || String(numeric) !== handoff[key]) {
                throw new Error(`candidate handoff ${key} exceeds exact API integer authority`);
              }
            }
            const normalLogin = typeof handoff.actor === 'string'
              && /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(handoff.actor);
            if (!normalLogin && handoff.actor !== 'github-actions[bot]') {
              throw new Error('candidate handoff actor is not an exact GitHub login');
            }
            for (const key of ['artifactSha256', 'contentInventorySha256']) {
              if (typeof handoff[key] !== 'string' || !/^[0-9a-f]{64}$/.test(handoff[key])) {
                throw new Error(`candidate handoff ${key} must be an exact lowercase SHA-256`);
              }
            }
            const expectedArtifactName = `preview-nightly-candidate-${handoff.runId}-${handoff.runAttempt}`;
            if (handoff.artifactName !== expectedArtifactName) {
              throw new Error('candidate handoff artifact name is not bound to the run and attempt');
            }
            const { owner, repo } = context.repo;
            const run = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: Number(handoff.runId)
            });
            if (run.data.status !== 'completed' || run.data.conclusion !== 'success') throw new Error('candidate run is not successful');
            if (run.data.event !== 'workflow_dispatch') throw new Error('candidate run must be a workflow_dispatch run');
            if (String(run.data.id) !== handoff.runId) throw new Error('candidate run ID mismatch');
            if (String(run.data.run_attempt) !== handoff.runAttempt) throw new Error('candidate run attempt mismatch');
            if (run.data.head_branch !== 'main' || run.data.head_sha !== handoff.sha) throw new Error('candidate main commit mismatch');
            if (!run.data.actor || run.data.actor.login !== handoff.actor) throw new Error('candidate producer actor mismatch');
            if (!workflowRunPathMatches(run.data.path, producerWorkflow, {
              branch: run.data.head_branch, ref: producerRef, sha: run.data.head_sha
            })) throw new Error('candidate workflow path mismatch');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: Number(handoff.runId), per_page: 100
            });
            const matches = artifacts.filter(a =>
              String(a.id) === handoff.artifactId && a.name === handoff.artifactName
            );
            if (matches.length !== 1) throw new Error('expected exactly one candidate artifact by exact ID and name');
            const artifact = matches[0];
            if (artifact.expired !== false) throw new Error('candidate artifact is expired');
            if (artifact.digest !== `sha256:${handoff.artifactSha256}`) {
              throw new Error('candidate artifact API digest mismatch');
            }
            const createdAt = Date.parse(artifact.created_at);
            const expiresAt = Date.parse(artifact.expires_at);
            if (!Number.isFinite(createdAt) || !Number.isFinite(expiresAt) || createdAt >= expiresAt || expiresAt <= Date.now()) {
              throw new Error('candidate artifact timestamps do not prove an unexpired artifact');
            }
            const authenticated = {
              actor: handoff.actor,
              artifactCreatedAt: artifact.created_at,
              artifactExpiresAt: artifact.expires_at,
              artifactId: handoff.artifactId,
              artifactName: handoff.artifactName,
              artifactSha256: handoff.artifactSha256,
              conclusion: run.data.conclusion,
              contractName: 'chummer6-ui.preview-nightly-candidate-authenticated-api',
              contractVersion: 1,
              event: run.data.event,
              ref: producerRef,
              repository: process.env.GITHUB_REPOSITORY,
              runAttempt: handoff.runAttempt,
              runId: handoff.runId,
              sha: handoff.sha,
              status: run.data.status,
              workflow: producerWorkflow,
            };
            const authenticatedJson = JSON.stringify(Object.fromEntries(
              Object.keys(authenticated).sort().map(key => [key, authenticated[key]])
            ));
            core.setOutput('artifact_id', handoff.artifactId);
            core.setOutput('artifact_name', handoff.artifactName);
            core.setOutput('candidate_run_id', handoff.runId);
            core.setOutput('authenticated_candidate_api_json', authenticatedJson);

      - name: Download only the authenticated candidate artifact ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.candidate-run.outputs.artifact_id }}
          path: ${{ env.CANDIDATE_ROOT }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.candidate-run.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
          merge-multiple: true

      - name: Preflight exact candidate bytes before execution
        id: candidate-bytes
        shell: pwsh
        env:
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
          CANDIDATE_API_JSON: ${{ steps.candidate-run.outputs.authenticated_candidate_api_json }}
        run: |
          $result = python scripts/windows_native_evidence.py preflight `
            --candidate-root $env:CANDIDATE_ROOT `
            --candidate-handoff-json $env:CANDIDATE_HANDOFF_JSON `
            --candidate-api-json $env:CANDIDATE_API_JSON
          if ($LASTEXITCODE -ne 0) { throw 'Candidate byte preflight failed before executable use.' }
          $bindings = $result | Where-Object { $_ -match '^[a-z0-9_]+=[A-Za-z0-9._/-]+$' }
          if ($bindings.Count -ne 14) { throw 'Candidate byte preflight did not emit the exact derived binding set.' }
          $bindings | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare evidence directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke'), `
            (Join-Path $env:EVIDENCE_ROOT 'screenshots') | Out-Null

      - name: Native startup receipt - Avalonia
        shell: bash
        env:
          CHUMMER_DESKTOP_RELEASE_CHANNEL: ${{ steps.candidate-bytes.outputs.channel }}
          CHUMMER_WINDOWS_STARTUP_SMOKE_PAYLOAD_MODE: download
          CHUMMER_STARTUP_SMOKE_REQUIRED_INSTALL_PATHS: Chummer.Avalonia.exe
          CHUMMER_STARTUP_SMOKE_LAUNCH_RELATIVE_PATH: Chummer.Avalonia.exe
          INSTALLER_RELATIVE: ${{ steps.candidate-bytes.outputs.avalonia_installer }}
          VERSION: ${{ steps.candidate-bytes.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/run-desktop-startup-smoke.sh \
            "$CANDIDATE_ROOT/$INSTALLER_RELATIVE" avalonia win-x64 Chummer.Avalonia.exe \
            "$EVIDENCE_ROOT/startup-smoke" "$VERSION"

      - name: Preserve exact Avalonia bootstrap progress log
        shell: pwsh
        run: |
          $source = Join-Path $env:TEMP 'Chummer6\installer-temp\chummer-desktop-installer-progress.log'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Avalonia native installer progress log is missing.' }
          Copy-Item -LiteralPath $source -Destination `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke\windows-installer-progress-avalonia-win-x64.log')

      - name: Native startup receipt - Blazor Desktop
        shell: bash
        env:
          CHUMMER_DESKTOP_RELEASE_CHANNEL: ${{ steps.candidate-bytes.outputs.channel }}
          CHUMMER_WINDOWS_STARTUP_SMOKE_PAYLOAD_MODE: download
          CHUMMER_STARTUP_SMOKE_REQUIRED_INSTALL_PATHS: Chummer.Blazor.Desktop.exe
          CHUMMER_STARTUP_SMOKE_LAUNCH_RELATIVE_PATH: Chummer.Blazor.Desktop.exe
          INSTALLER_RELATIVE: ${{ steps.candidate-bytes.outputs.blazor_desktop_installer }}
          VERSION: ${{ steps.candidate-bytes.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/run-desktop-startup-smoke.sh \
            "$CANDIDATE_ROOT/$INSTALLER_RELATIVE" blazor-desktop win-x64 Chummer.Blazor.Desktop.exe \
            "$EVIDENCE_ROOT/startup-smoke" "$VERSION"

      - name: Preserve exact Blazor Desktop bootstrap progress log
        shell: pwsh
        run: |
          $source = Join-Path $env:TEMP 'Chummer6\installer-temp\chummer-desktop-installer-progress.log'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Blazor Desktop native installer progress log is missing.' }
          Copy-Item -LiteralPath $source -Destination `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke\windows-installer-progress-blazor-desktop-win-x64.log')

      - name: Capture interactive Avalonia progress and completion
        shell: pwsh
        env:
          INSTALLER_RELATIVE: ${{ steps.candidate-bytes.outputs.avalonia_installer }}
          PAYLOAD_RELATIVE: ${{ steps.candidate-bytes.outputs.avalonia_payload }}
          PAYLOAD_SHA256: ${{ steps.candidate-bytes.outputs.avalonia_payload_sha256 }}
        run: |
          ./scripts/capture_windows_installer_visual.ps1 `
            -Head avalonia `
            -InstallerPath (Join-Path $env:CANDIDATE_ROOT $env:INSTALLER_RELATIVE) `
            -PayloadPath (Join-Path $env:CANDIDATE_ROOT $env:PAYLOAD_RELATIVE) `
            -PayloadSha256 $env:PAYLOAD_SHA256 `
            -ProgressScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-progress.png') `
            -CompletionScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-completion.png')

      - name: Capture interactive Blazor Desktop progress and completion
        shell: pwsh
        env:
          INSTALLER_RELATIVE: ${{ steps.candidate-bytes.outputs.blazor_desktop_installer }}
          PAYLOAD_RELATIVE: ${{ steps.candidate-bytes.outputs.blazor_desktop_payload }}
          PAYLOAD_SHA256: ${{ steps.candidate-bytes.outputs.blazor_desktop_payload_sha256 }}
        run: |
          ./scripts/capture_windows_installer_visual.ps1 `
            -Head blazor-desktop `
            -InstallerPath (Join-Path $env:CANDIDATE_ROOT $env:INSTALLER_RELATIVE) `
            -PayloadPath (Join-Path $env:CANDIDATE_ROOT $env:PAYLOAD_RELATIVE) `
            -PayloadSha256 $env:PAYLOAD_SHA256 `
            -ProgressScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-blazor-desktop-win-x64-progress.png') `
            -CompletionScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-blazor-desktop-win-x64-completion.png')

      - name: Validate, bind, and inventory native evidence
        id: inventory
        shell: pwsh
        env:
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
          CANDIDATE_API_JSON: ${{ steps.candidate-run.outputs.authenticated_candidate_api_json }}
        run: |
          $result = python scripts/windows_native_evidence.py capture `
            --candidate-root $env:CANDIDATE_ROOT --evidence-root $env:EVIDENCE_ROOT `
            --candidate-handoff-json $env:CANDIDATE_HANDOFF_JSON `
            --candidate-api-json $env:CANDIDATE_API_JSON `
            --source-repository '${{ github.repository }}' --source-workflow '.github/workflows/windows-native-evidence-capture.yml' `
            --source-run-id '${{ github.run_id }}' --source-run-attempt '${{ github.run_attempt }}' `
            --source-ref '${{ github.ref }}' --source-sha '${{ github.sha }}' --source-actor '${{ github.actor }}' `
            --output-artifact-name $env:OUTPUT_ARTIFACT_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence contract validation failed.' }
          $inventory = $result | Where-Object { $_ -like 'capture_inventory_sha256=*' } | Select-Object -Last 1
          if (-not $inventory) { throw 'Capture inventory SHA-256 output is missing.' }
          $inventory | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "### Native Windows capture`n`nArtifact: ``$env:OUTPUT_ARTIFACT_NAME```n`nInventory: ``$($inventory.Split('=',2)[1])``" | `
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload capture artifact only
        id: upload-capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record immutable capture artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-capture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-capture.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-capture.outputs.artifact-url }}
        run: |
          {
            echo '### Uploaded native Windows capture artifact'
            echo
            echo "Name: \`$OUTPUT_ARTIFACT_NAME\`"
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "Artifact URL: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
