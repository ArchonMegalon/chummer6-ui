name: Windows native evidence capture

on:
  workflow_dispatch:
    inputs:
      candidate_handoff_json:
        description: Exact canonical JSON emitted by the fixed preview candidate exporter
        required: true
        type: string
      n_minus_one_release_json:
        description: Exact canonical immutable N-1 Windows installer/payload authority
        required: true
        type: string
      live_release_channel_json:
        description: Exact UTF-8 bytes of the live public release-channel root
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-native-evidence-capture-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture on native Windows
    runs-on: windows-latest
    timeout-minutes: 90
    outputs:
      artifact_id: ${{ steps.upload-capture.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-capture.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload-capture.outputs.artifact-url }}
      capture_inventory_sha256: ${{ steps.inventory.outputs.capture_inventory_sha256 }}
      authenticode_verification_sha256: ${{ steps.inventory.outputs.authenticode_verification_sha256 }}
      lifecycle_receipt_sha256: ${{ steps.inventory.outputs.lifecycle_receipt_sha256 }}
    env:
      EVIDENCE_ROOT: ${{ github.workspace }}/native-evidence
      OUTPUT_ARTIFACT_NAME: windows-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out evidence contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Validate immutable N-1 and signer relay authority
        id: relay-authority
        shell: pwsh
        env:
          N_MINUS_ONE_RELEASE_JSON: ${{ inputs.n_minus_one_release_json }}
          LIVE_RELEASE_CHANNEL_JSON: ${{ inputs.live_release_channel_json }}
          AUTHENTICODE_SIGNER_CERTIFICATE_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_CERT_SHA256 }}
          AUTHENTICODE_SIGNER_SPKI_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_SPKI_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $liveUrl = 'https://chummer.run/downloads/RELEASE_CHANNEL.generated.json'
          $handler = [Net.Http.HttpClientHandler]::new()
          $handler.AllowAutoRedirect = $false
          $handler.AutomaticDecompression = [Net.DecompressionMethods]::None
          $client = [Net.Http.HttpClient]::new($handler)
          try {
            $request = [Net.Http.HttpRequestMessage]::new(
              [Net.Http.HttpMethod]::Get,
              $liveUrl
            )
            $request.Headers.Accept.ParseAdd('application/json')
            $request.Headers.AcceptEncoding.ParseAdd('identity')
            $request.Headers.UserAgent.ParseAdd(
              'chummer6-ui-windows-live-predecessor/1'
            )
            $response = $client.SendAsync(
              $request,
              [Net.Http.HttpCompletionOption]::ResponseHeadersRead
            ).GetAwaiter().GetResult()
            if ($response.StatusCode -ne [Net.HttpStatusCode]::OK `
                -or $response.RequestMessage.RequestUri.AbsoluteUri -cne $liveUrl) {
              throw 'Live release root returned a redirect or non-200 response.'
            }
            $encodings = @($response.Content.Headers.ContentEncoding)
            if ($encodings.Count -gt 1 `
                -or ($encodings.Count -eq 1 -and $encodings[0] -cne 'identity')) {
              throw 'Live release root returned encoded bytes.'
            }
            if ($null -ne $response.Content.Headers.ContentLength `
                -and ($response.Content.Headers.ContentLength -lt 1 `
                  -or $response.Content.Headers.ContentLength -gt 65536)) {
              throw 'Live release root content length is outside the fixed bound.'
            }
            $stream = $response.Content.ReadAsStreamAsync().GetAwaiter().GetResult()
            $memory = [IO.MemoryStream]::new()
            try {
              $buffer = [byte[]]::new(8192)
              while (($count = $stream.Read($buffer, 0, $buffer.Length)) -gt 0) {
                $memory.Write($buffer, 0, $count)
                if ($memory.Length -gt 65536) {
                  throw 'Live release root exceeded the fixed byte bound.'
                }
              }
              if ($memory.Length -lt 1) {
                throw 'Live release root was empty.'
              }
              $strictUtf8 = [Text.UTF8Encoding]::new($false, $true)
              $fetchedLiveRaw = $strictUtf8.GetString($memory.ToArray())
            }
            finally {
              $memory.Dispose()
              $stream.Dispose()
            }
          }
          finally {
            if ($null -ne $response) { $response.Dispose() }
            if ($null -ne $request) { $request.Dispose() }
            $client.Dispose()
            $handler.Dispose()
          }
          if ($fetchedLiveRaw -cne $env:LIVE_RELEASE_CHANNEL_JSON) {
            throw 'Live release-root bytes changed after hosted preflight.'
          }
          $result = & python scripts/desktop_native_lifecycle_evidence.py `
            validate-windows-relay-authority `
            --binding-json $env:N_MINUS_ONE_RELEASE_JSON `
            --live-release-channel-json $fetchedLiveRaw `
            --signer-certificate-sha256 $env:AUTHENTICODE_SIGNER_CERTIFICATE_SHA256 `
            --signer-spki-sha256 $env:AUTHENTICODE_SIGNER_SPKI_SHA256
          if ($LASTEXITCODE -ne 0) {
            throw 'Immutable N-1 or signer relay authority validation failed.'
          }
          $digest = @($result | Where-Object { $_ -match '^sha256=[0-9a-f]{64}$' })
          $liveDigest = @($result | Where-Object {
            $_ -match '^live_release_channel_sha256=[0-9a-f]{64}$'
          })
          $selectedDigest = @($result | Where-Object {
            $_ -match '^selected_tuple_sha256=[0-9a-f]{64}$'
          })
          if ($digest.Count -ne 1 -or $liveDigest.Count -ne 1 `
              -or $selectedDigest.Count -ne 1) {
            throw 'Live-predecessor relay authority did not emit exact digests.'
          }
          "n_minus_one_release_sha256=$($digest[0].Substring(7))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "live_release_channel_sha256=$($liveDigest[0].Substring(28))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "selected_tuple_sha256=$($selectedDigest[0].Substring(22))" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Authenticate exact candidate run and artifact
        id: candidate-run
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
          N_MINUS_ONE_RELEASE_JSON: ${{ inputs.n_minus_one_release_json }}
          LIVE_RELEASE_CHANNEL_JSON: ${{ inputs.live_release_channel_json }}
          VALIDATED_N_MINUS_ONE_RELEASE_SHA256: ${{ steps.relay-authority.outputs.n_minus_one_release_sha256 }}
          VALIDATED_LIVE_RELEASE_CHANNEL_SHA256: ${{ steps.relay-authority.outputs.live_release_channel_sha256 }}
          VALIDATED_SELECTED_TUPLE_SHA256: ${{ steps.relay-authority.outputs.selected_tuple_sha256 }}
          AUTHENTICODE_SIGNER_CERTIFICATE_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_CERT_SHA256 }}
          AUTHENTICODE_SIGNER_SPKI_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_SPKI_SHA256 }}
        with:
          github-token: ${{ github.token }}
          script: |
            const crypto = require('crypto');
            const fs = require('fs');
            const path = require('path');
            const { workflowRunPathMatches } = require('./scripts/github_workflow_run_path.js');
            const { waitForExactSuccessfulWorkflowRun } = require('./scripts/github_wait_for_workflow_run.js');
            const producerWorkflow = '.github/workflows/preview-nightly-candidate-export.yml';
            const producerRef = 'refs/heads/main';
            const handoffKeys = [
              'actor', 'artifactId', 'artifactName', 'artifactSha256',
              'contentInventorySha256', 'contractName', 'contractVersion', 'ref',
              'repository', 'runAttempt', 'runId', 'sha', 'workflow',
              'fullShelfManifestSha256', 'publicationScopeSha256',
              'fullShelfCompatibilityManifestSha256',
              'registryPrepareSha256', 'scopeDecisionSha256', 'signingReceiptSha256',
              'liveReleaseChannelSha256', 'selectedTupleSha256',
              'nMinusOneReleaseSha256', 'authenticodeSignerCertificateSha256',
              'authenticodeSignerSpkiSha256'
            ].sort();
            let handoff;
            try { handoff = JSON.parse(process.env.CANDIDATE_HANDOFF_JSON); }
            catch (error) { throw new Error('candidate_handoff_json is invalid JSON'); }
            if (!handoff || Array.isArray(handoff) || typeof handoff !== 'object') {
              throw new Error('candidate_handoff_json must be an object');
            }
            if (JSON.stringify(Object.keys(handoff).sort()) !== JSON.stringify(handoffKeys)) {
              throw new Error('candidate_handoff_json has missing or extra fields');
            }
            const canonical = JSON.stringify(Object.fromEntries(
              Object.keys(handoff).sort().map(key => [key, handoff[key]])
            ));
            if (canonical !== process.env.CANDIDATE_HANDOFF_JSON) {
              throw new Error('candidate_handoff_json must use exact canonical JSON serialization');
            }
            const exact = {
              contractName: 'chummer6-ui.preview-nightly-candidate-handoff',
              contractVersion: 4,
              repository: process.env.GITHUB_REPOSITORY,
              workflow: producerWorkflow,
              ref: producerRef,
              sha: process.env.GITHUB_SHA,
            };
            for (const [key, value] of Object.entries(exact)) {
              if (handoff[key] !== value || typeof handoff[key] !== typeof value) {
                throw new Error(`candidate handoff ${key} authority mismatch`);
              }
            }
            if (process.env.GITHUB_ACTOR !== 'github-actions[bot]') {
              throw new Error('native capture must be dispatched by the hosted producer relay');
            }
            if (process.env.GITHUB_TRIGGERING_ACTOR !== process.env.GITHUB_ACTOR) {
              throw new Error('native capture permits only same-actor reruns');
            }
            if (!/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ID || '')
                || !/^[1-9][0-9]*$/.test(process.env.GITHUB_RUN_ATTEMPT || '')) {
              throw new Error('native capture run ID or attempt is invalid');
            }
            for (const key of ['runId', 'runAttempt', 'artifactId']) {
              if (typeof handoff[key] !== 'string' || !/^[1-9][0-9]*$/.test(handoff[key])) {
                throw new Error(`candidate handoff ${key} must be an exact positive integer string`);
              }
              const numeric = Number(handoff[key]);
              if (!Number.isSafeInteger(numeric) || String(numeric) !== handoff[key]) {
                throw new Error(`candidate handoff ${key} exceeds exact API integer authority`);
              }
            }
            const normalLogin = typeof handoff.actor === 'string'
              && /^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(handoff.actor);
            if (!normalLogin && handoff.actor !== 'github-actions[bot]') {
              throw new Error('candidate handoff actor is not an exact GitHub login');
            }
            for (const key of [
              'artifactSha256', 'contentInventorySha256', 'fullShelfManifestSha256',
              'fullShelfCompatibilityManifestSha256',
              'publicationScopeSha256', 'registryPrepareSha256',
              'scopeDecisionSha256', 'signingReceiptSha256',
              'liveReleaseChannelSha256', 'selectedTupleSha256',
              'nMinusOneReleaseSha256', 'authenticodeSignerCertificateSha256',
              'authenticodeSignerSpkiSha256'
            ]) {
              if (typeof handoff[key] !== 'string' || !/^[0-9a-f]{64}$/.test(handoff[key])) {
                throw new Error(`candidate handoff ${key} must be an exact lowercase SHA-256`);
              }
            }
            const nMinusOneSha256 = crypto.createHash('sha256')
              .update(Buffer.from(process.env.N_MINUS_ONE_RELEASE_JSON, 'utf8'))
              .digest('hex');
            if (nMinusOneSha256 !== process.env.VALIDATED_N_MINUS_ONE_RELEASE_SHA256
                || handoff.nMinusOneReleaseSha256 !== nMinusOneSha256) {
              throw new Error('candidate handoff differs from exact validated N-1 authority bytes');
            }
            const liveReleaseChannelSha256 = crypto.createHash('sha256')
              .update(Buffer.from(process.env.LIVE_RELEASE_CHANNEL_JSON, 'utf8'))
              .digest('hex');
            if (liveReleaseChannelSha256
                  !== process.env.VALIDATED_LIVE_RELEASE_CHANNEL_SHA256
                || handoff.liveReleaseChannelSha256
                  !== liveReleaseChannelSha256
                || handoff.selectedTupleSha256
                  !== process.env.VALIDATED_SELECTED_TUPLE_SHA256) {
              throw new Error(
                'candidate handoff differs from exact live-predecessor authority'
              );
            }
            if (handoff.authenticodeSignerCertificateSha256
                  !== process.env.AUTHENTICODE_SIGNER_CERTIFICATE_SHA256
                || handoff.authenticodeSignerSpkiSha256
                  !== process.env.AUTHENTICODE_SIGNER_SPKI_SHA256) {
              throw new Error('candidate handoff signer authority differs from authorized pins');
            }
            const expectedArtifactName = `preview-nightly-candidate-${handoff.runId}-${handoff.runAttempt}`;
            if (handoff.artifactName !== expectedArtifactName) {
              throw new Error('candidate handoff artifact name is not bound to the run and attempt');
            }
            const { owner, repo } = context.repo;
            const run = await waitForExactSuccessfulWorkflowRun({
              github, owner, repo, runId: handoff.runId, runAttempt: handoff.runAttempt
            });
            if (run.data.status !== 'completed' || run.data.conclusion !== 'success') throw new Error('candidate run is not successful');
            if (run.data.event !== 'workflow_dispatch') throw new Error('candidate run must be a workflow_dispatch run');
            if (String(run.data.id) !== handoff.runId) throw new Error('candidate run ID mismatch');
            if (String(run.data.run_attempt) !== handoff.runAttempt) throw new Error('candidate run attempt mismatch');
            if (run.data.head_branch !== 'main' || run.data.head_sha !== handoff.sha) throw new Error('candidate main commit mismatch');
            if (!run.data.actor || run.data.actor.login !== handoff.actor) throw new Error('candidate producer actor mismatch');
            if (!workflowRunPathMatches(run.data.path, producerWorkflow, {
              branch: run.data.head_branch, ref: producerRef, sha: run.data.head_sha
            })) throw new Error('candidate workflow path mismatch');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: Number(handoff.runId), per_page: 100
            });
            const matches = artifacts.filter(a =>
              String(a.id) === handoff.artifactId && a.name === handoff.artifactName
            );
            if (matches.length !== 1) throw new Error('expected exactly one candidate artifact by exact ID and name');
            const artifact = matches[0];
            if (artifact.expired !== false) throw new Error('candidate artifact is expired');
            if (artifact.digest !== `sha256:${handoff.artifactSha256}`) {
              throw new Error('candidate artifact API digest mismatch');
            }
            if (!Number.isSafeInteger(artifact.size_in_bytes) || artifact.size_in_bytes < 1
                || artifact.size_in_bytes > 2 * 1024 * 1024 * 1024) {
              throw new Error('candidate artifact API size is outside the fixed download bound');
            }
            const createdAt = Date.parse(artifact.created_at);
            const expiresAt = Date.parse(artifact.expires_at);
            const now = Date.now();
            if (!Number.isFinite(createdAt) || !Number.isFinite(expiresAt) || createdAt >= expiresAt
                || createdAt > now + 5 * 60 * 1000 || expiresAt <= now) {
              throw new Error('candidate artifact timestamps do not prove an unexpired artifact');
            }
            const authenticated = {
              actor: handoff.actor,
              artifactCreatedAt: artifact.created_at,
              artifactExpiresAt: artifact.expires_at,
              artifactId: handoff.artifactId,
              artifactName: handoff.artifactName,
              artifactSha256: handoff.artifactSha256,
              conclusion: run.data.conclusion,
              contractName: 'chummer6-ui.preview-nightly-candidate-authenticated-api',
              contractVersion: 1,
              event: run.data.event,
              ref: producerRef,
              repository: process.env.GITHUB_REPOSITORY,
              runAttempt: handoff.runAttempt,
              runId: handoff.runId,
              sha: handoff.sha,
              status: run.data.status,
              workflow: producerWorkflow,
            };
            const authenticatedJson = JSON.stringify(Object.fromEntries(
              Object.keys(authenticated).sort().map(key => [key, authenticated[key]])
            ));
            if (typeof process.env.RUNNER_TEMP !== 'string'
                || !path.isAbsolute(process.env.RUNNER_TEMP)) {
              throw new Error('RUNNER_TEMP is not an exact absolute private-root authority');
            }
            const runnerTemp = path.resolve(process.env.RUNNER_TEMP);
            const privateRoot = fs.mkdtempSync(path.join(runnerTemp, 'chummer-candidate-'));
            try {
              fs.chmodSync(privateRoot, 0o700);
              const archive = await github.rest.actions.downloadArtifact({
                owner,
                repo,
                artifact_id: Number(handoff.artifactId),
                archive_format: 'zip',
              });
              let archiveBytes;
              if (Buffer.isBuffer(archive.data)) {
                archiveBytes = archive.data;
              } else if (archive.data instanceof ArrayBuffer) {
                archiveBytes = Buffer.from(archive.data);
              } else if (ArrayBuffer.isView(archive.data)) {
                archiveBytes = Buffer.from(
                  archive.data.buffer, archive.data.byteOffset, archive.data.byteLength
                );
              } else {
                throw new Error('candidate artifact REST download did not return exact binary ZIP bytes');
              }
              if (archiveBytes.byteLength !== artifact.size_in_bytes) {
                throw new Error('candidate artifact ZIP byte length differs from authenticated REST metadata');
              }
              const archiveDigest = crypto.createHash('sha256').update(archiveBytes).digest('hex');
              if (`sha256:${archiveDigest}` !== artifact.digest) {
                throw new Error('candidate artifact ZIP bytes differ from the authenticated REST digest');
              }
              const archivePath = path.join(privateRoot, 'candidate.zip');
              fs.writeFileSync(archivePath, archiveBytes, { flag: 'wx', mode: 0o600 });
              fs.chmodSync(archivePath, 0o600);
              core.setOutput('candidate_private_root', privateRoot);
              core.setOutput('candidate_zip_path', archivePath);
              core.setOutput('candidate_held_root', path.join(privateRoot, 'held'));
              core.setOutput(
                'candidate_authority_path', path.join(privateRoot, 'held-authority.json')
              );
            } catch (error) {
              fs.rmSync(privateRoot, { recursive: true, force: true });
              throw error;
            }
            core.setOutput('artifact_id', handoff.artifactId);
            core.setOutput('artifact_name', handoff.artifactName);
            core.setOutput('candidate_run_id', handoff.runId);
            core.setOutput('authenticated_candidate_api_json', authenticatedJson);

      - name: Authenticate ZIP and materialize one private held candidate before execution
        id: candidate-bytes
        shell: pwsh
        env:
          CANDIDATE_ZIP: ${{ steps.candidate-run.outputs.candidate_zip_path }}
          CANDIDATE_ROOT: ${{ steps.candidate-run.outputs.candidate_held_root }}
          CANDIDATE_AUTHORITY: ${{ steps.candidate-run.outputs.candidate_authority_path }}
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
          CANDIDATE_API_JSON: ${{ steps.candidate-run.outputs.authenticated_candidate_api_json }}
        run: |
          try {
            $result = python scripts/windows_native_evidence.py materialize `
              --candidate-zip $env:CANDIDATE_ZIP `
              --held-root $env:CANDIDATE_ROOT `
              --authority-json $env:CANDIDATE_AUTHORITY `
              --candidate-handoff-json $env:CANDIDATE_HANDOFF_JSON `
              --candidate-api-json $env:CANDIDATE_API_JSON
            if ($LASTEXITCODE -ne 0) { throw 'Candidate ZIP authentication/materialization failed.' }
          }
          finally {
            if (Test-Path -LiteralPath $env:CANDIDATE_ZIP) {
              Remove-Item -LiteralPath $env:CANDIDATE_ZIP -Force -ErrorAction Stop
            }
            if (Test-Path -LiteralPath $env:CANDIDATE_ZIP) {
              throw 'Private candidate ZIP cleanup failed.'
            }
          }
          $bindings = $result | Where-Object { $_ -match '^[a-z0-9_]+=[A-Za-z0-9._/-]+$' }
          if ($bindings.Count -ne 19) { throw 'Held candidate did not emit the exact signed publication binding set.' }
          $bindings | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Execute and capture only while exact held snapshot handles are locked
        id: inventory
        shell: pwsh
        env:
          CANDIDATE_ROOT: ${{ steps.candidate-run.outputs.candidate_held_root }}
          CANDIDATE_AUTHORITY: ${{ steps.candidate-run.outputs.candidate_authority_path }}
          CANDIDATE_HANDOFF_JSON: ${{ inputs.candidate_handoff_json }}
          CANDIDATE_API_JSON: ${{ steps.candidate-run.outputs.authenticated_candidate_api_json }}
          N_MINUS_ONE_RELEASE_JSON: ${{ inputs.n_minus_one_release_json }}
          LIVE_RELEASE_CHANNEL_JSON: ${{ inputs.live_release_channel_json }}
          VALIDATED_N_MINUS_ONE_RELEASE_SHA256: ${{ steps.relay-authority.outputs.n_minus_one_release_sha256 }}
          VALIDATED_LIVE_RELEASE_CHANNEL_SHA256: ${{ steps.relay-authority.outputs.live_release_channel_sha256 }}
          VALIDATED_SELECTED_TUPLE_SHA256: ${{ steps.relay-authority.outputs.selected_tuple_sha256 }}
          VERSION: ${{ steps.candidate-bytes.outputs.version }}
          CHANNEL: ${{ steps.candidate-bytes.outputs.channel }}
          CANDIDATE_MANIFEST: ${{ steps.candidate-bytes.outputs.candidate_manifest }}
          CANDIDATE_MANIFEST_SHA256: ${{ steps.candidate-bytes.outputs.candidate_manifest_sha256 }}
          CANDIDATE_CONTENT_INVENTORY_SHA256: ${{ steps.candidate-bytes.outputs.candidate_content_inventory_sha256 }}
          CANDIDATE_EXPORT_RECEIPT_SHA256: ${{ steps.candidate-bytes.outputs.candidate_export_receipt_sha256 }}
          AVALONIA_INSTALLER: ${{ steps.candidate-bytes.outputs.avalonia_installer }}
          AVALONIA_INSTALLER_SHA256: ${{ steps.candidate-bytes.outputs.avalonia_installer_sha256 }}
          AVALONIA_PAYLOAD: ${{ steps.candidate-bytes.outputs.avalonia_payload }}
          AVALONIA_PAYLOAD_SHA256: ${{ steps.candidate-bytes.outputs.avalonia_payload_sha256 }}
          PUBLICATION_SCOPE: ${{ steps.candidate-bytes.outputs.publication_scope }}
          PUBLICATION_SCOPE_SHA256: ${{ steps.candidate-bytes.outputs.publication_scope_sha256 }}
          SIGNING_RECEIPT: ${{ steps.candidate-bytes.outputs.signing_receipt }}
          SIGNING_RECEIPT_SHA256: ${{ steps.candidate-bytes.outputs.signing_receipt_sha256 }}
          FULL_SHELF_MANIFEST: ${{ steps.candidate-bytes.outputs.full_shelf_manifest }}
          FULL_SHELF_MANIFEST_SHA256: ${{ steps.candidate-bytes.outputs.full_shelf_manifest_sha256 }}
          FULL_SHELF_COMPATIBILITY_MANIFEST: ${{ steps.candidate-bytes.outputs.full_shelf_compatibility_manifest }}
          FULL_SHELF_COMPATIBILITY_MANIFEST_SHA256: ${{ steps.candidate-bytes.outputs.full_shelf_compatibility_manifest_sha256 }}
          SCOPE_DECISION_SHA256: ${{ steps.candidate-bytes.outputs.scope_decision_sha256 }}
          AUTHENTICODE_SIGNER_CERTIFICATE_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_CERT_SHA256 }}
          AUTHENTICODE_SIGNER_SPKI_SHA256: ${{ vars.CHUMMER_WINDOWS_AUTHENTICODE_SIGNER_SPKI_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-LiveHeldIdentity([System.IO.FileStream] $Stream) {
            $savedPosition = $Stream.Position
            $sha = [Security.Cryptography.SHA256]::Create()
            try {
              $Stream.Position = 0
              $digest = [BitConverter]::ToString($sha.ComputeHash($Stream)).Replace('-', '').ToLowerInvariant()
              return @{ sha256 = $digest; sizeBytes = $Stream.Length }
            }
            finally {
              $sha.Dispose()
              $Stream.Position = $savedPosition
            }
          }

          $authority = Get-Content -LiteralPath $env:CANDIDATE_AUTHORITY -Raw | ConvertFrom-Json
          $authorityKeys = @($authority.PSObject.Properties.Name | Sort-Object)
          if (($authorityKeys -join ',') -ne 'artifactSha256,contractName,contractVersion,files') {
            throw 'Held snapshot authority has missing or extra fields.'
          }
          if ($authority.contractName -cne 'chummer6-ui.preview-nightly-candidate-held-snapshot' `
              -or (($authority.contractVersion -isnot [Int32]) -and ($authority.contractVersion -isnot [Int64])) `
              -or $authority.contractVersion -ne 2) {
            throw 'Held snapshot authority contract is invalid.'
          }
          $handoff = $env:CANDIDATE_HANDOFF_JSON | ConvertFrom-Json
          if ($authority.artifactSha256 -cne $handoff.artifactSha256) {
            throw 'Held snapshot authority differs from the authenticated artifact digest.'
          }
          $expectedPaths = @(
            'PREVIEW_NIGHTLY_CANDIDATE_CONTENT_INVENTORY.generated.json',
            'PREVIEW_NIGHTLY_CANDIDATE_EXPORT.generated.json',
            $env:CANDIDATE_MANIFEST,
            $env:AVALONIA_INSTALLER,
            $env:AVALONIA_PAYLOAD,
            $env:PUBLICATION_SCOPE,
            $env:SIGNING_RECEIPT,
            $env:FULL_SHELF_MANIFEST,
            $env:FULL_SHELF_COMPATIBILITY_MANIFEST,
            'release-evidence/sbom/chummer-avalonia-linux-x64.cdx.json',
            'release-evidence/sbom/chummer-avalonia-win-x64.cdx.json',
            'release-evidence/vulnerability/OSV_SCAN-avalonia-linux-x64.generated.json',
            'release-evidence/vulnerability/OSV_SCAN-avalonia-win-x64.generated.json',
            'release-evidence/PREVIEW_SUPPLY_CHAIN_GATE.generated.json'
          ) | Sort-Object
          $authorityRows = @($authority.files)
          if ($authorityRows.Count -ne 14) { throw 'Held snapshot authority must bind exactly fourteen files.' }
          $actualPaths = @($authorityRows | ForEach-Object { $_.path } | Sort-Object)
          if (($actualPaths -join "`n") -cne ($expectedPaths -join "`n")) {
            throw 'Held snapshot authority file set differs from the exact fourteen files.'
          }

          $root = [IO.Path]::GetFullPath($env:CANDIDATE_ROOT)
          $rootPrefix = $root.TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
          $locks = @{}
          try {
            foreach ($row in $authorityRows) {
              $rowKeys = @($row.PSObject.Properties.Name | Sort-Object)
              if (($rowKeys -join ',') -ne 'path,sha256,sizeBytes' `
                  -or $row.sha256 -cnotmatch '^[0-9a-f]{64}$' `
                  -or (($row.sizeBytes -isnot [Int32]) -and ($row.sizeBytes -isnot [Int64])) `
                  -or $row.sizeBytes -lt 1) {
                throw "Held snapshot authority row is invalid: $($row.path)"
              }
              $fullPath = [IO.Path]::GetFullPath((Join-Path $root $row.path))
              if (-not $fullPath.StartsWith($rootPrefix, [StringComparison]::OrdinalIgnoreCase)) {
                throw "Held snapshot path escapes its private root: $($row.path)"
              }
              $stream = [IO.File]::Open(
                $fullPath, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]::Read
              )
              $locks[$row.path] = @{ stream = $stream; expected = $row }
              $identity = Get-LiveHeldIdentity $stream
              if ($identity.sha256 -cne $row.sha256 -or $identity.sizeBytes -ne $row.sizeBytes) {
                throw "Live held handle differs at lock acquisition: $($row.path)"
              }
            }

            $lockedResult = & python scripts/windows_native_evidence.py preflight `
              --candidate-root $env:CANDIDATE_ROOT `
              --candidate-handoff-json $env:CANDIDATE_HANDOFF_JSON `
              --candidate-api-json $env:CANDIDATE_API_JSON
            $lockedPreflightExit = $LASTEXITCODE
            if ($lockedPreflightExit -ne 0) {
              throw "Under-lock candidate preflight failed with exit $lockedPreflightExit."
            }
            $lockedBindings = @{}
            foreach ($line in @($lockedResult | Where-Object { $_ -match '^[a-z0-9_]+=[A-Za-z0-9._/-]+$' })) {
              $parts = $line.Split('=', 2)
              if ($lockedBindings.ContainsKey($parts[0])) { throw 'Under-lock preflight emitted a duplicate binding.' }
              $lockedBindings[$parts[0]] = $parts[1]
            }
            $expectedBindings = @{
              version = $env:VERSION
              channel = $env:CHANNEL
              candidate_manifest = $env:CANDIDATE_MANIFEST
              candidate_manifest_sha256 = $env:CANDIDATE_MANIFEST_SHA256
              candidate_content_inventory_sha256 = $env:CANDIDATE_CONTENT_INVENTORY_SHA256
              candidate_export_receipt_sha256 = $env:CANDIDATE_EXPORT_RECEIPT_SHA256
              avalonia_installer = $env:AVALONIA_INSTALLER
              avalonia_installer_sha256 = $env:AVALONIA_INSTALLER_SHA256
              avalonia_payload = $env:AVALONIA_PAYLOAD
              avalonia_payload_sha256 = $env:AVALONIA_PAYLOAD_SHA256
              publication_scope = $env:PUBLICATION_SCOPE
              publication_scope_sha256 = $env:PUBLICATION_SCOPE_SHA256
              signing_receipt = $env:SIGNING_RECEIPT
              signing_receipt_sha256 = $env:SIGNING_RECEIPT_SHA256
              full_shelf_manifest = $env:FULL_SHELF_MANIFEST
              full_shelf_manifest_sha256 = $env:FULL_SHELF_MANIFEST_SHA256
              full_shelf_compatibility_manifest = $env:FULL_SHELF_COMPATIBILITY_MANIFEST
              full_shelf_compatibility_manifest_sha256 = $env:FULL_SHELF_COMPATIBILITY_MANIFEST_SHA256
              scope_decision_sha256 = $env:SCOPE_DECISION_SHA256
            }
            if ($lockedBindings.Count -ne $expectedBindings.Count) {
              throw 'Under-lock preflight binding count is not exact.'
            }
            foreach ($key in $expectedBindings.Keys) {
              if (-not $lockedBindings.ContainsKey($key) -or $lockedBindings[$key] -cne $expectedBindings[$key]) {
                throw "Under-lock preflight binding differs: $key"
              }
            }

            New-Item -ItemType Directory -Force -Path `
              (Join-Path $env:EVIDENCE_ROOT 'startup-smoke'), `
              (Join-Path $env:EVIDENCE_ROOT 'screenshots'), `
              (Join-Path $env:EVIDENCE_ROOT 'authenticode') | Out-Null

            & pwsh -NoProfile -File ./scripts/verify-windows-authenticode.ps1 `
              -ArtifactPath (Join-Path $root $env:AVALONIA_INSTALLER) `
              -ExpectedArtifactSha256 $env:AVALONIA_INSTALLER_SHA256 `
              -ExpectedArtifactSizeBytes ([long]$locks[$env:AVALONIA_INSTALLER].expected.sizeBytes) `
              -ExpectedSignerCertificateSha256 $env:AUTHENTICODE_SIGNER_CERTIFICATE_SHA256 `
              -ExpectedSignerSpkiSha256 $env:AUTHENTICODE_SIGNER_SPKI_SHA256 `
              -OutputPath (Join-Path $env:EVIDENCE_ROOT 'authenticode\AUTHENTICODE_VERIFICATION-avalonia-win-x64.generated.json') `
              -SourceRepository '${{ github.repository }}' `
              -SourceWorkflow '.github/workflows/windows-native-evidence-capture.yml' `
              -SourceRunId '${{ github.run_id }}' -SourceRunAttempt '${{ github.run_attempt }}' `
              -SourceRef '${{ github.ref }}' -SourceSha '${{ github.sha }}' `
              -SourceActor '${{ github.actor }}' `
              -SourceTriggeringActor '${{ github.triggering_actor }}'
            $authenticodeExit = $LASTEXITCODE
            if ($authenticodeExit -ne 0) {
              throw "Independent Authenticode verification failed with exit $authenticodeExit."
            }

            # The interactive visual capture below performs a full install and
            # intentionally leaves the registered candidate in place. Execute
            # the clean-install lifecycle first so its clean-runner assertion
            # is meaningful; the lifecycle itself normally uninstalls.
            $lifecycleRoot = Join-Path $env:EVIDENCE_ROOT 'lifecycle'
            New-Item -ItemType Directory -Force -Path $lifecycleRoot | Out-Null
            $lifecycleResult = & pwsh -NoProfile -File ./scripts/run-windows-native-lifecycle-e2e.ps1 `
              -CandidateInstaller (Join-Path $root $env:AVALONIA_INSTALLER) `
              -CandidateInstallerSha256 $env:AVALONIA_INSTALLER_SHA256 `
              -CandidateInstallerSizeBytes ([long]$locks[$env:AVALONIA_INSTALLER].expected.sizeBytes) `
              -CandidatePayload (Join-Path $root $env:AVALONIA_PAYLOAD) `
              -CandidatePayloadSha256 $env:AVALONIA_PAYLOAD_SHA256 `
              -CandidatePayloadSizeBytes ([long]$locks[$env:AVALONIA_PAYLOAD].expected.sizeBytes) `
              -CandidateSigningReceipt (Join-Path $root $env:SIGNING_RECEIPT) `
              -CandidateSigningReceiptSha256 $env:SIGNING_RECEIPT_SHA256 `
              -CandidateSigningReceiptSizeBytes ([long]$locks[$env:SIGNING_RECEIPT].expected.sizeBytes) `
              -CandidateVersion $env:VERSION `
              -NMinusOneBindingJson $env:N_MINUS_ONE_RELEASE_JSON `
              -LiveReleaseChannelJson $env:LIVE_RELEASE_CHANNEL_JSON `
              -ExpectedNMinusOneReleaseSha256 $env:VALIDATED_N_MINUS_ONE_RELEASE_SHA256 `
              -ExpectedLiveReleaseChannelSha256 $env:VALIDATED_LIVE_RELEASE_CHANNEL_SHA256 `
              -ExpectedSelectedTupleSha256 $env:VALIDATED_SELECTED_TUPLE_SHA256 `
              -ExpectedSignerCertificateSha256 $env:AUTHENTICODE_SIGNER_CERTIFICATE_SHA256 `
              -ExpectedSignerSpkiSha256 $env:AUTHENTICODE_SIGNER_SPKI_SHA256 `
              -OutputRoot $lifecycleRoot `
              -SourceRepository '${{ github.repository }}' `
              -SourceWorkflow '.github/workflows/windows-native-evidence-capture.yml' `
              -SourceRunId '${{ github.run_id }}' `
              -SourceRunAttempt '${{ github.run_attempt }}' `
              -SourceRef '${{ github.ref }}' `
              -SourceSha '${{ github.sha }}' `
              -SourceActor '${{ github.actor }}' `
              -SourceTriggeringActor '${{ github.triggering_actor }}'
            $lifecycleExit = $LASTEXITCODE
            if ($lifecycleExit -ne 0) {
              throw "Native Windows lifecycle E2E failed with exit $lifecycleExit."
            }
            $lifecycle = $lifecycleResult |
              Where-Object { $_ -match '^lifecycle_receipt_sha256=[0-9a-f]{64}$' } |
              Select-Object -Last 1
            if (-not $lifecycle) {
              throw 'Native Windows lifecycle receipt SHA-256 output is missing or invalid.'
            }

            $env:CHUMMER_DESKTOP_RELEASE_CHANNEL = $env:CHANNEL
            $env:CHUMMER_WINDOWS_STARTUP_SMOKE_PAYLOAD_MODE = 'download'

            $env:CHUMMER_STARTUP_SMOKE_REQUIRED_INSTALL_PATHS = 'Chummer.Avalonia.exe'
            $env:CHUMMER_STARTUP_SMOKE_LAUNCH_RELATIVE_PATH = 'Chummer.Avalonia.exe'
            & bash scripts/run-desktop-startup-smoke.sh `
              (Join-Path $root $env:AVALONIA_INSTALLER) avalonia win-x64 Chummer.Avalonia.exe `
              (Join-Path $env:EVIDENCE_ROOT 'startup-smoke') $env:VERSION
            $avaloniaStartupExit = $LASTEXITCODE
            if ($avaloniaStartupExit -ne 0) {
              throw "Avalonia startup smoke failed with exit $avaloniaStartupExit."
            }
            $progressSource = Join-Path $env:TEMP 'Chummer6\installer-temp\chummer-desktop-installer-progress.log'
            if (-not (Test-Path -LiteralPath $progressSource)) {
              throw 'Avalonia native installer progress log is missing.'
            }
            Copy-Item -LiteralPath $progressSource -Destination `
              (Join-Path $env:EVIDENCE_ROOT 'startup-smoke\windows-installer-progress-avalonia-win-x64.log')

            & pwsh -NoProfile -File ./scripts/capture_windows_installer_visual.ps1 `
              -Head avalonia `
              -InstallerPath (Join-Path $root $env:AVALONIA_INSTALLER) `
              -PayloadPath (Join-Path $root $env:AVALONIA_PAYLOAD) `
              -PayloadSha256 $env:AVALONIA_PAYLOAD_SHA256 `
              -ProgressScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-progress.png') `
              -CompletionScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-completion.png')
            $avaloniaVisualExit = $LASTEXITCODE
            if ($avaloniaVisualExit -ne 0) {
              throw "Avalonia interactive capture failed with exit $avaloniaVisualExit."
            }

            $result = & python scripts/windows_native_evidence.py capture `
              --candidate-root $env:CANDIDATE_ROOT --evidence-root $env:EVIDENCE_ROOT `
              --candidate-handoff-json $env:CANDIDATE_HANDOFF_JSON `
              --candidate-api-json $env:CANDIDATE_API_JSON `
              --source-repository '${{ github.repository }}' --source-workflow '.github/workflows/windows-native-evidence-capture.yml' `
              --source-run-id '${{ github.run_id }}' --source-run-attempt '${{ github.run_attempt }}' `
              --source-ref '${{ github.ref }}' --source-sha '${{ github.sha }}' --source-actor '${{ github.actor }}' `
              --source-triggering-actor '${{ github.triggering_actor }}' `
              --expected-authenticode-signer-certificate-sha256 $env:AUTHENTICODE_SIGNER_CERTIFICATE_SHA256 `
              --expected-authenticode-signer-spki-sha256 $env:AUTHENTICODE_SIGNER_SPKI_SHA256 `
              --output-artifact-name $env:OUTPUT_ARTIFACT_NAME
            $captureExit = $LASTEXITCODE
            if ($captureExit -ne 0) { throw "Native evidence capture failed with exit $captureExit." }

            foreach ($path in $locks.Keys) {
              $identity = Get-LiveHeldIdentity $locks[$path].stream
              $expected = $locks[$path].expected
              if ($identity.sha256 -cne $expected.sha256 -or $identity.sizeBytes -ne $expected.sizeBytes) {
                throw "Live held handle differs after capture: $path"
              }
            }
            $inventory = $result | Where-Object { $_ -match '^capture_inventory_sha256=[0-9a-f]{64}$' } | Select-Object -Last 1
            if (-not $inventory) { throw 'Capture inventory SHA-256 output is missing or invalid.' }
            $authenticode = $result | Where-Object { $_ -match '^authenticode_verification_sha256=[0-9a-f]{64}$' } | Select-Object -Last 1
            if (-not $authenticode) { throw 'Authenticode verification SHA-256 output is missing or invalid.' }
            @($inventory, $authenticode, $lifecycle) | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            "### Native Windows capture`n`nArtifact: ``$env:OUTPUT_ARTIFACT_NAME```n`nInventory: ``$($inventory.Split('=',2)[1])```n`nAuthenticode receipt: ``$($authenticode.Split('=',2)[1])```n`nLifecycle receipt: ``$($lifecycle.Split('=',2)[1])``" | `
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
          finally {
            foreach ($entry in $locks.Values) {
              if ($null -ne $entry.stream) { $entry.stream.Dispose() }
            }
          }

      - name: Upload capture artifact only
        id: upload-capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record immutable capture artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-capture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-capture.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-capture.outputs.artifact-url }}
        run: |
          {
            echo '### Uploaded native Windows capture artifact'
            echo
            echo "Name: \`$OUTPUT_ARTIFACT_NAME\`"
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "Artifact URL: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private candidate transport and held snapshot
        if: always()
        shell: pwsh
        env:
          CANDIDATE_PRIVATE_ROOT: ${{ steps.candidate-run.outputs.candidate_private_root }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CANDIDATE_PRIVATE_ROOT)) { exit 0 }
          $root = [IO.Path]::GetFullPath($env:CANDIDATE_PRIVATE_ROOT)
          $temp = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/') + [IO.Path]::DirectorySeparatorChar
          if (-not $root.StartsWith($temp, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'Refusing candidate cleanup outside RUNNER_TEMP.'
          }
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $root) { throw 'Private candidate cleanup failed.' }
