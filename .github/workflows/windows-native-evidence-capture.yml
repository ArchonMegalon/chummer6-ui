name: Windows native evidence capture

on:
  workflow_dispatch:
    inputs:
      candidate_repository:
        description: Exact owner/repository containing the staged candidate run
        required: true
        type: string
      candidate_workflow:
        description: Exact candidate workflow path (for example .github/workflows/stage.yml)
        required: true
        type: string
      candidate_run_id:
        description: Exact successful candidate workflow run ID
        required: true
        type: string
      candidate_ref:
        description: Exact candidate ref recorded by the source run
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      candidate_artifact_name:
        description: Exact candidate artifact name
        required: true
        type: string
      release_identity_json:
        description: 'Exact JSON: {"version":"...","channel":"preview","manifestPath":"...","manifestSha256":"64 lowercase hex"}'
        required: true
        type: string
      avalonia_binding_json:
        description: 'Exact JSON: {"installerPath":"...","installerSha256":"...","payloadPath":"...","payloadSha256":"..."}'
        required: true
        type: string
      blazor_binding_json:
        description: 'Exact JSON with installerPath, installerSha256, payloadPath, and payloadSha256'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-native-evidence-capture-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  capture:
    name: Capture on native Windows
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      artifact_id: ${{ steps.upload-capture.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload-capture.outputs.artifact-digest }}
      artifact_url: ${{ steps.upload-capture.outputs.artifact-url }}
      capture_inventory_sha256: ${{ steps.inventory.outputs.capture_inventory_sha256 }}
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/candidate
      EVIDENCE_ROOT: ${{ github.workspace }}/native-evidence
      OUTPUT_ARTIFACT_NAME: windows-native-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out evidence contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Authenticate exact candidate run and artifact
        id: candidate-run
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_WORKFLOW: ${{ inputs.candidate_workflow }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          RELEASE_IDENTITY_JSON: ${{ inputs.release_identity_json }}
          AVALONIA_BINDING_JSON: ${{ inputs.avalonia_binding_json }}
          BLAZOR_BINDING_JSON: ${{ inputs.blazor_binding_json }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { workflowRunPathMatches } = require('./scripts/github_workflow_run_path.js');
            function exactObject(raw, keys, label) {
              let value;
              try { value = JSON.parse(raw); } catch (error) { throw new Error(`${label} is invalid JSON`); }
              if (!value || Array.isArray(value) || typeof value !== 'object') throw new Error(`${label} must be an object`);
              const actual = Object.keys(value).sort();
              const expected = [...keys].sort();
              if (JSON.stringify(actual) !== JSON.stringify(expected)) throw new Error(`${label} has missing or extra fields`);
              for (const key of keys) if (typeof value[key] !== 'string' || !value[key].trim()) throw new Error(`${label}.${key} is missing`);
              return value;
            }
            function exactSha(value, label) {
              if (!/^[0-9a-f]{64}$/.test(value)) throw new Error(`${label} must be 64 lowercase hex characters`);
            }
            function relativePath(value, label) {
              if (value.startsWith('/') || value.startsWith('\\') || value.split(/[\\/]+/).includes('..')) throw new Error(`${label} must be candidate-root-relative`);
            }
            const release = exactObject(process.env.RELEASE_IDENTITY_JSON,
              ['version', 'channel', 'manifestPath', 'manifestSha256'], 'release_identity_json');
            const avalonia = exactObject(process.env.AVALONIA_BINDING_JSON,
              ['installerPath', 'installerSha256', 'payloadPath', 'payloadSha256'], 'avalonia_binding_json');
            const blazor = exactObject(process.env.BLAZOR_BINDING_JSON,
              ['installerPath', 'installerSha256', 'payloadPath', 'payloadSha256'], 'blazor_binding_json');
            if (!['preview', 'nightly'].includes(release.channel)) throw new Error('release channel must be preview or nightly');
            exactSha(release.manifestSha256, 'manifestSha256');
            relativePath(release.manifestPath, 'manifestPath');
            for (const [label, binding] of [['avalonia', avalonia], ['blazor', blazor]]) {
              exactSha(binding.installerSha256, `${label}.installerSha256`);
              exactSha(binding.payloadSha256, `${label}.payloadSha256`);
              relativePath(binding.installerPath, `${label}.installerPath`);
              relativePath(binding.payloadPath, `${label}.payloadPath`);
            }
            const [owner, repo, extra] = process.env.CANDIDATE_REPOSITORY.split('/');
            if (!owner || !repo || extra) throw new Error('candidate_repository must be exact owner/repository');
            if (!/^[0-9]+$/.test(process.env.CANDIDATE_RUN_ID)) throw new Error('candidate_run_id must be numeric');
            if (!/^[0-9a-f]{40}$/.test(process.env.CANDIDATE_SHA)) throw new Error('candidate SHA must be exact lowercase hex');
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: Number(process.env.CANDIDATE_RUN_ID) });
            if (run.data.status !== 'completed' || run.data.conclusion !== 'success') throw new Error('candidate run is not successful');
            if (run.data.head_sha !== process.env.CANDIDATE_SHA) throw new Error('candidate commit SHA mismatch');
            const acceptedRefs = new Set([run.data.head_branch, `refs/heads/${run.data.head_branch}`, `refs/tags/${run.data.head_branch}`]);
            if (!acceptedRefs.has(process.env.CANDIDATE_REF)) throw new Error('candidate ref mismatch');
            if (!workflowRunPathMatches(run.data.path, process.env.CANDIDATE_WORKFLOW, {
              branch: run.data.head_branch, ref: process.env.CANDIDATE_REF, sha: run.data.head_sha
            })) throw new Error('candidate workflow path mismatch');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id: Number(process.env.CANDIDATE_RUN_ID), per_page: 100
            });
            const matches = artifacts.filter(a => a.name === process.env.CANDIDATE_ARTIFACT_NAME && !a.expired);
            if (matches.length !== 1) throw new Error('expected exactly one unexpired named candidate artifact');
            for (const [key, value] of Object.entries({
              version: release.version, channel: release.channel, manifest_path: release.manifestPath,
              manifest_sha256: release.manifestSha256, avalonia_installer: avalonia.installerPath,
              avalonia_installer_sha256: avalonia.installerSha256, avalonia_payload: avalonia.payloadPath,
              avalonia_payload_sha256: avalonia.payloadSha256, blazor_installer: blazor.installerPath,
              blazor_installer_sha256: blazor.installerSha256, blazor_payload: blazor.payloadPath,
              blazor_payload_sha256: blazor.payloadSha256
            })) core.setOutput(key, value);

      - name: Download only the named candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ inputs.candidate_artifact_name }}
          path: ${{ env.CANDIDATE_ROOT }}
          repository: ${{ inputs.candidate_repository }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}

      - name: Preflight exact candidate bytes before execution
        shell: pwsh
        env:
          CANDIDATE_MANIFEST: ${{ steps.candidate-run.outputs.manifest_path }}
          CANDIDATE_MANIFEST_SHA256: ${{ steps.candidate-run.outputs.manifest_sha256 }}
          VERSION: ${{ steps.candidate-run.outputs.version }}
          CHANNEL: ${{ steps.candidate-run.outputs.channel }}
          AVALONIA_INSTALLER: ${{ steps.candidate-run.outputs.avalonia_installer }}
          AVALONIA_INSTALLER_SHA256: ${{ steps.candidate-run.outputs.avalonia_installer_sha256 }}
          AVALONIA_PAYLOAD: ${{ steps.candidate-run.outputs.avalonia_payload }}
          AVALONIA_PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.avalonia_payload_sha256 }}
          BLAZOR_INSTALLER: ${{ steps.candidate-run.outputs.blazor_installer }}
          BLAZOR_INSTALLER_SHA256: ${{ steps.candidate-run.outputs.blazor_installer_sha256 }}
          BLAZOR_PAYLOAD: ${{ steps.candidate-run.outputs.blazor_payload }}
          BLAZOR_PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.blazor_payload_sha256 }}
        run: |
          python scripts/windows_native_evidence.py preflight `
            --candidate-root $env:CANDIDATE_ROOT --candidate-manifest $env:CANDIDATE_MANIFEST `
            --candidate-manifest-sha256 $env:CANDIDATE_MANIFEST_SHA256 `
            --version $env:VERSION --channel $env:CHANNEL `
            --avalonia-installer $env:AVALONIA_INSTALLER --avalonia-installer-sha256 $env:AVALONIA_INSTALLER_SHA256 `
            --avalonia-payload $env:AVALONIA_PAYLOAD --avalonia-payload-sha256 $env:AVALONIA_PAYLOAD_SHA256 `
            --blazor-desktop-installer $env:BLAZOR_INSTALLER --blazor-desktop-installer-sha256 $env:BLAZOR_INSTALLER_SHA256 `
            --blazor-desktop-payload $env:BLAZOR_PAYLOAD --blazor-desktop-payload-sha256 $env:BLAZOR_PAYLOAD_SHA256
          if ($LASTEXITCODE -ne 0) { throw 'Candidate byte preflight failed before executable use.' }

      - name: Prepare evidence directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke'), `
            (Join-Path $env:EVIDENCE_ROOT 'screenshots') | Out-Null

      - name: Native startup receipt - Avalonia
        shell: bash
        env:
          CHUMMER_DESKTOP_RELEASE_CHANNEL: ${{ steps.candidate-run.outputs.channel }}
          CHUMMER_WINDOWS_STARTUP_SMOKE_PAYLOAD_MODE: download
          CHUMMER_STARTUP_SMOKE_REQUIRED_INSTALL_PATHS: Chummer.Avalonia.exe
          CHUMMER_STARTUP_SMOKE_LAUNCH_RELATIVE_PATH: Chummer.Avalonia.exe
          INSTALLER_RELATIVE: ${{ steps.candidate-run.outputs.avalonia_installer }}
          VERSION: ${{ steps.candidate-run.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/run-desktop-startup-smoke.sh \
            "$CANDIDATE_ROOT/$INSTALLER_RELATIVE" avalonia win-x64 Chummer.Avalonia.exe \
            "$EVIDENCE_ROOT/startup-smoke" "$VERSION"

      - name: Preserve exact Avalonia bootstrap progress log
        shell: pwsh
        run: |
          $source = Join-Path $env:TEMP 'Chummer6\installer-temp\chummer-desktop-installer-progress.log'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Avalonia native installer progress log is missing.' }
          Copy-Item -LiteralPath $source -Destination `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke\windows-installer-progress-avalonia-win-x64.log')

      - name: Native startup receipt - Blazor Desktop
        shell: bash
        env:
          CHUMMER_DESKTOP_RELEASE_CHANNEL: ${{ steps.candidate-run.outputs.channel }}
          CHUMMER_WINDOWS_STARTUP_SMOKE_PAYLOAD_MODE: download
          CHUMMER_STARTUP_SMOKE_REQUIRED_INSTALL_PATHS: Chummer.Blazor.Desktop.exe
          CHUMMER_STARTUP_SMOKE_LAUNCH_RELATIVE_PATH: Chummer.Blazor.Desktop.exe
          INSTALLER_RELATIVE: ${{ steps.candidate-run.outputs.blazor_installer }}
          VERSION: ${{ steps.candidate-run.outputs.version }}
        run: |
          set -euo pipefail
          bash scripts/run-desktop-startup-smoke.sh \
            "$CANDIDATE_ROOT/$INSTALLER_RELATIVE" blazor-desktop win-x64 Chummer.Blazor.Desktop.exe \
            "$EVIDENCE_ROOT/startup-smoke" "$VERSION"

      - name: Preserve exact Blazor Desktop bootstrap progress log
        shell: pwsh
        run: |
          $source = Join-Path $env:TEMP 'Chummer6\installer-temp\chummer-desktop-installer-progress.log'
          if (-not (Test-Path -LiteralPath $source)) { throw 'Blazor Desktop native installer progress log is missing.' }
          Copy-Item -LiteralPath $source -Destination `
            (Join-Path $env:EVIDENCE_ROOT 'startup-smoke\windows-installer-progress-blazor-desktop-win-x64.log')

      - name: Capture interactive Avalonia progress and completion
        shell: pwsh
        env:
          INSTALLER_RELATIVE: ${{ steps.candidate-run.outputs.avalonia_installer }}
          PAYLOAD_RELATIVE: ${{ steps.candidate-run.outputs.avalonia_payload }}
          PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.avalonia_payload_sha256 }}
        run: |
          ./scripts/capture_windows_installer_visual.ps1 `
            -Head avalonia `
            -InstallerPath (Join-Path $env:CANDIDATE_ROOT $env:INSTALLER_RELATIVE) `
            -PayloadPath (Join-Path $env:CANDIDATE_ROOT $env:PAYLOAD_RELATIVE) `
            -PayloadSha256 $env:PAYLOAD_SHA256 `
            -ProgressScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-progress.png') `
            -CompletionScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-avalonia-win-x64-completion.png')

      - name: Capture interactive Blazor Desktop progress and completion
        shell: pwsh
        env:
          INSTALLER_RELATIVE: ${{ steps.candidate-run.outputs.blazor_installer }}
          PAYLOAD_RELATIVE: ${{ steps.candidate-run.outputs.blazor_payload }}
          PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.blazor_payload_sha256 }}
        run: |
          ./scripts/capture_windows_installer_visual.ps1 `
            -Head blazor-desktop `
            -InstallerPath (Join-Path $env:CANDIDATE_ROOT $env:INSTALLER_RELATIVE) `
            -PayloadPath (Join-Path $env:CANDIDATE_ROOT $env:PAYLOAD_RELATIVE) `
            -PayloadSha256 $env:PAYLOAD_SHA256 `
            -ProgressScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-blazor-desktop-win-x64-progress.png') `
            -CompletionScreenshot (Join-Path $env:EVIDENCE_ROOT 'screenshots\windows-installer-blazor-desktop-win-x64-completion.png')

      - name: Validate, bind, and inventory native evidence
        id: inventory
        shell: pwsh
        env:
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_WORKFLOW: ${{ inputs.candidate_workflow }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CANDIDATE_ARTIFACT_NAME: ${{ inputs.candidate_artifact_name }}
          CANDIDATE_MANIFEST: ${{ steps.candidate-run.outputs.manifest_path }}
          CANDIDATE_MANIFEST_SHA256: ${{ steps.candidate-run.outputs.manifest_sha256 }}
          VERSION: ${{ steps.candidate-run.outputs.version }}
          CHANNEL: ${{ steps.candidate-run.outputs.channel }}
          AVALONIA_INSTALLER: ${{ steps.candidate-run.outputs.avalonia_installer }}
          AVALONIA_INSTALLER_SHA256: ${{ steps.candidate-run.outputs.avalonia_installer_sha256 }}
          AVALONIA_PAYLOAD: ${{ steps.candidate-run.outputs.avalonia_payload }}
          AVALONIA_PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.avalonia_payload_sha256 }}
          BLAZOR_INSTALLER: ${{ steps.candidate-run.outputs.blazor_installer }}
          BLAZOR_INSTALLER_SHA256: ${{ steps.candidate-run.outputs.blazor_installer_sha256 }}
          BLAZOR_PAYLOAD: ${{ steps.candidate-run.outputs.blazor_payload }}
          BLAZOR_PAYLOAD_SHA256: ${{ steps.candidate-run.outputs.blazor_payload_sha256 }}
        run: |
          $result = python scripts/windows_native_evidence.py capture `
            --candidate-root $env:CANDIDATE_ROOT --candidate-manifest $env:CANDIDATE_MANIFEST `
            --candidate-manifest-sha256 $env:CANDIDATE_MANIFEST_SHA256 --evidence-root $env:EVIDENCE_ROOT `
            --version $env:VERSION --channel $env:CHANNEL `
            --avalonia-installer $env:AVALONIA_INSTALLER --avalonia-installer-sha256 $env:AVALONIA_INSTALLER_SHA256 `
            --avalonia-payload $env:AVALONIA_PAYLOAD --avalonia-payload-sha256 $env:AVALONIA_PAYLOAD_SHA256 `
            --blazor-desktop-installer $env:BLAZOR_INSTALLER --blazor-desktop-installer-sha256 $env:BLAZOR_INSTALLER_SHA256 `
            --blazor-desktop-payload $env:BLAZOR_PAYLOAD --blazor-desktop-payload-sha256 $env:BLAZOR_PAYLOAD_SHA256 `
            --source-repository '${{ github.repository }}' --source-workflow '.github/workflows/windows-native-evidence-capture.yml' `
            --source-run-id '${{ github.run_id }}' --source-run-attempt '${{ github.run_attempt }}' `
            --source-ref '${{ github.ref }}' --source-sha '${{ github.sha }}' --source-actor '${{ github.actor }}' `
            --output-artifact-name $env:OUTPUT_ARTIFACT_NAME `
            --candidate-repository $env:CANDIDATE_REPOSITORY --candidate-workflow $env:CANDIDATE_WORKFLOW `
            --candidate-run-id $env:CANDIDATE_RUN_ID --candidate-ref $env:CANDIDATE_REF --candidate-sha $env:CANDIDATE_SHA `
            --candidate-artifact-name $env:CANDIDATE_ARTIFACT_NAME
          if ($LASTEXITCODE -ne 0) { throw 'Native evidence contract validation failed.' }
          $inventory = $result | Where-Object { $_ -like 'capture_inventory_sha256=*' } | Select-Object -Last 1
          if (-not $inventory) { throw 'Capture inventory SHA-256 output is missing.' }
          $inventory | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "### Native Windows capture`n`nArtifact: ``$env:OUTPUT_ARTIFACT_NAME```n`nInventory: ``$($inventory.Split('=',2)[1])``" | `
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload capture artifact only
        id: upload-capture
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.OUTPUT_ARTIFACT_NAME }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Record immutable capture artifact identity
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload-capture.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload-capture.outputs.artifact-digest }}
          ARTIFACT_URL: ${{ steps.upload-capture.outputs.artifact-url }}
        run: |
          {
            echo '### Uploaded native Windows capture artifact'
            echo
            echo "Name: \`$OUTPUT_ARTIFACT_NAME\`"
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "Artifact digest: \`$ARTIFACT_DIGEST\`"
            echo "Artifact URL: $ARTIFACT_URL"
          } >> "$GITHUB_STEP_SUMMARY"
