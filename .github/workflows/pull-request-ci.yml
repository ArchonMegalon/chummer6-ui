name: Pull request CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-controls:
    name: Build and release-control guards
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact pull-request merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve sealed or split-preseal validation mode
        id: package-plane-state
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ai/verify_split_preseal_publication.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --detect)"
          test "$mode" = "sealed" || test "$mode" = "preseal"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Validate GitHub Actions workflow semantics
        env:
          ACTIONLINT_ARCHIVE_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          actionlint_root="$RUNNER_TEMP/actionlint"
          test ! -e "$archive"
          test ! -e "$actionlint_root"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_ARCHIVE_SHA256" "$archive" \
            | sha256sum --check --strict -
          mkdir --mode=0700 "$actionlint_root"
          tar --extract --gzip --file "$archive" --directory "$actionlint_root" actionlint
          test "$("$actionlint_root/actionlint" -version | head -n 1)" = "$ACTIONLINT_VERSION"
          "$actionlint_root/actionlint" -color

      - name: Set up locked .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.103

      - name: Set up exact locked KeyLocker verifier .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.110

      - name: Validate injected KeyLocker fixtures and offline verifier
        run: |
          set -euo pipefail
          fixture_root="$GITHUB_WORKSPACE/tests/fixtures/keylocker-signer-v1"
          python3 scripts/verify_keylocker_fixture_bundle.py \
            --source-root "$GITHUB_WORKSPACE" \
            --fixture-root "$fixture_root"
          pushd scripts/Chummer.KeyLockerSigner >/dev/null
          dotnet restore \
            ../../tests/Chummer.KeyLockerSigner.FixtureTests/Chummer.KeyLockerSigner.FixtureTests.csproj \
            --locked-mode
          dotnet run \
            --project ../../tests/Chummer.KeyLockerSigner.FixtureTests/Chummer.KeyLockerSigner.FixtureTests.csproj \
            --configuration Release \
            --no-restore \
            -- "$fixture_root" --portable-ci
          popd >/dev/null

      - name: Automatic source, package-boundary, secret, license, and receipt guards
        run: >-
          python3 scripts/ai/verify_pull_request_controls.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

      - name: Generated release-gate consistency
        run: python3 scripts/check_ui_release_gate_consistency.py

      - name: Create hash-locked Python test environment
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-ci-python"
          "$RUNNER_TEMP/ui-ci-python/bin/python" -m pip install \
            --disable-pip-version-check \
            --only-binary=:all: \
            --require-hashes \
            --requirement .github/requirements-ci.txt

      - name: Parse native Windows evidence PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = @(
            'scripts/capture_unsigned_windows_preview_startup_visual.ps1',
            'scripts/capture_windows_installer_visual.ps1',
            'scripts/verify_unsigned_windows_preview_authenticode.ps1'
          )
          foreach ($script in $scripts) {
            $resolved = (Resolve-Path -LiteralPath $script).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $resolved,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $messages = $errors |
                ForEach-Object { "$script`: $($_.Message)" }
              throw ($messages -join [Environment]::NewLine)
            }
          }

      - name: Check out exact Registry test authority
        if: steps.package-plane-state.outputs.mode == 'sealed'
        env:
          REGISTRY_ROOT: ${{ runner.temp }}/chummer-hub-registry
        run: |
          set -euo pipefail
          test ! -e "$REGISTRY_ROOT"
          mkdir --mode=0700 "$REGISTRY_ROOT"
          /usr/bin/git -C "$REGISTRY_ROOT" init --quiet
          /usr/bin/git -C "$REGISTRY_ROOT" remote add origin \
            https://github.com/ArchonMegalon/chummer6-hub-registry.git
          /usr/bin/git -C "$REGISTRY_ROOT" -c protocol.version=2 fetch \
            --no-tags --depth=1 origin 87fa62009779439443ad599740e5f2764a7c4a7c
          /usr/bin/git -C "$REGISTRY_ROOT" checkout --detach --quiet FETCH_HEAD

      - name: Verify exact Registry test authority
        if: steps.package-plane-state.outputs.mode == 'sealed'
        env:
          REGISTRY_ROOT: ${{ runner.temp }}/chummer-hub-registry
        run: >-
          test "$(/usr/bin/git -C "$REGISTRY_ROOT" rev-parse HEAD)"
          = "87fa62009779439443ad599740e5f2764a7c4a7c"
          && test -z "$(/usr/bin/git -C "$REGISTRY_ROOT" status --porcelain --untracked-files=all)"
          && test "$(/usr/bin/git -C "$REGISTRY_ROOT" remote get-url origin)"
          = "https://github.com/ArchonMegalon/chummer6-hub-registry.git"

      - name: Release-control unit tests
        if: steps.package-plane-state.outputs.mode == 'sealed'
        env:
          CHUMMER_UI_TEST_REGISTRY_ROOT: ${{ runner.temp }}/chummer-hub-registry
        run: >-
          "$RUNNER_TEMP/ui-ci-python/bin/python" -m pytest -q
          tests/test_verify_mode_controls.py
          tests/test_fresh_package_plane_controls.py
          tests/test_global_flagship_candidate_producer.py
          tests/test_global_flagship_candidate_workflow.py
          tests/test_global_flagship_release_assembler.py
          tests/test_global_flagship_release_approval_workflow.py
          tests/test_global_flagship_provider_authentication.py
          tests/test_global_flagship_provider_authentication_workflow.py
          tests/test_global_flagship_protected_publication.py
          tests/test_global_flagship_protected_publication_workflow.py
          tests/test_desktop_native_lifecycle_evidence.py
          tests/test_keylocker_fixture_intake.py
          tests/test_unsigned_macos_native_build.py
          tests/test_macos_flagship_evidence.py
          tests/test_preview_nightly_pipeline.py
          tests/test_preview_supply_chain.py
          tests/test_preview_nightly_candidate_export.py
          tests/test_preview_nightly_jit_launcher.py
          tests/test_preview_nightly_stage_contract.py
          tests/test_preview_nightly_unsigned_stage.py
          tests/test_preview_nightly_unsigned_scope.py
          tests/test_preview_nightly_unsigned_candidate_export.py
          tests/test_preview_nightly_unsigned_direct_import.py
          tests/test_preview_nightly_unsigned_jit_launcher.py
          tests/test_unsigned_windows_preview_nightly_workflow.py
          tests/test_unsigned_windows_preview_native_evidence.py
          tests/test_unsigned_windows_preview_native_evidence_workflows.py
          tests/test_windows_installer_completion_trace.py
          tests/test_windows_native_evidence.py
          tests/test_windows_native_bootstrap_toolchain.py
          tests/test_desktop_downloads_local_release_policy.py

      - name: Split-preseal contract tests without consumer or release claims
        if: steps.package-plane-state.outputs.mode == 'preseal'
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ui-ci-python/bin/python" -m pytest -q \
            tests/test_split_preseal_publication.py
          "$RUNNER_TEMP/ui-ci-python/bin/python" -m pytest -q \
            tests/test_fresh_package_plane_controls.py \
            -k 'sealed_next_transition or transition_capture or cold_core_bundle or cold_hub_receipt'

      - name: Required split-preseal topology and nonclaim receipt
        if: steps.package-plane-state.outputs.mode == 'preseal'
        run: |
          set -euo pipefail
          python3 scripts/ai/verify_split_preseal_publication.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --receipt-output "$RUNNER_TEMP/UI_REQUIRED_SPLIT_PRESEAL.generated.json"
          {
            printf '### Split-preseal publication boundary\n\n'
            printf 'This check grants no package-consumer, release, or publication authority.\n\n'
            printf '**Merge method: rebase only.** Squash or merge-commit publication fails the current-main topology receipt.\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload required non-authoritative split-preseal receipt
        if: steps.package-plane-state.outputs.mode == 'preseal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-required-split-preseal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UI_REQUIRED_SPLIT_PRESEAL.generated.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out exact pull-request merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48

  fresh-package-plane:
    name: Fresh checkout and pinned same-run package feed
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact pull-request merge
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve sealed or split-preseal validation mode
        id: package-plane-state
        run: |
          set -euo pipefail
          mode="$(python3 scripts/ai/verify_split_preseal_publication.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --detect)"
          test "$mode" = "sealed" || test "$mode" = "preseal"
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"

      - name: Set up exact locked .NET SDK
        if: steps.package-plane-state.outputs.mode == 'sealed'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.103

      - name: Build all release consumers and run product unit tests with no siblings or ambient inputs
        if: steps.package-plane-state.outputs.mode == 'sealed'
        run: >-
          python3 scripts/ai/verify_fresh_checkout_package_plane.py
          --receipt-output "$RUNNER_TEMP/UI_FRESH_PACKAGE_PLANE.generated.json"

      - name: Validate split-preseal without package consumer or release claims
        if: steps.package-plane-state.outputs.mode == 'preseal'
        run: >-
          python3 scripts/ai/verify_split_preseal_publication.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --receipt-output "$RUNNER_TEMP/UI_SPLIT_PRESEAL.generated.json"

      - name: Upload machine-readable package-plane receipt
        if: steps.package-plane-state.outputs.mode == 'sealed'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-fresh-package-plane-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UI_FRESH_PACKAGE_PLANE.generated.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload non-authoritative split-preseal receipt
        if: steps.package-plane-state.outputs.mode == 'preseal'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-split-preseal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/UI_SPLIT_PRESEAL.generated.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
