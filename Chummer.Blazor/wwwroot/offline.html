<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f3b3e" />
    <title>Chummer Online Offline</title>
    <style>
        :root {
            color-scheme: dark;
            --page: #08111f;
            --panel: #102235;
            --edge: #31d0aa;
            --text: #f1f7f5;
            --muted: #9fc5bd;
        }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            background:
                radial-gradient(circle at 20% 20%, rgba(49, 208, 170, 0.18), transparent 28rem),
                linear-gradient(135deg, #08111f 0%, #11233a 55%, #0e302f 100%);
            color: var(--text);
            font-family: "Segoe UI", sans-serif;
        }

        main {
            width: min(34rem, calc(100vw - 2rem));
            padding: 1.25rem;
            border: 1px solid rgba(49, 208, 170, 0.45);
            border-radius: 1.25rem;
            background: rgba(16, 34, 53, 0.88);
            box-shadow: 0 1rem 4rem rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.8rem, 7vw, 3.4rem);
            letter-spacing: -0.04em;
        }

        p {
            margin: 0.55rem 0;
            color: var(--muted);
            line-height: 1.55;
        }

        a {
            display: inline-flex;
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 999px;
            background: var(--edge);
            color: #06211b;
            font-weight: 800;
            text-decoration: none;
        }
    </style>
</head>
<body>
<main>
    <p>Chummer Online PWA</p>
    <h1>Offline shell ready.</h1>
    <p>Your runner data is not cached by this fallback. Reconnect to load live workspace, Black Ledger, heat, and session state.</p>
    <p>The installed app keeps only static shell assets offline so opt-in living-world data stays server-bound.</p>
    <a href="./app">Retry Chummer Online</a>
</main>
</body>
</html>
